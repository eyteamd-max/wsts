name = "sts2-steam"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 绑定自定义子域（与主站 axxxx.cyou 同站）
# deploy 时会自动创建 DNS 记录
routes = [
  { custom_domain = true, pattern = "steam.axxxx.cyou" }
]

# KV 命名空间：缓存模组元数据（解析结果）
# 创建命令: wrangler kv:namespace create STEAM_META
# 创建后填入 id
[[kv_namespaces]]
binding = "STEAM_META"
id = "在此填入KV命名空间ID"

# KV 命名空间：缓存下载文件 URL（避免频繁调用 Steam API 获取 file_url）
# 可复用 STEAM_META，这里独立出来便于管理
# 创建命令: wrangler kv:namespace create STEAM_FILE_URL
[[kv_namespaces]]
binding = "STEAM_FILE_URL"
id = "在此填入KV命名空间ID"

# R2 存储桶：缓存热门模组文件本体，实现"秒下"
# 创建命令: wrangler r2 bucket create sts2-steam-files
[[r2_buckets]]
binding = "STEAM_FILES"
bucket_name = "sts2-steam-files"

[vars]
# STS2 的 Steam AppID
STEAM_APPID = "2868840"
# 站点域名（CORS 用）
SITE_ORIGIN = "https://axxxx.cyou"
# 文件缓存 TTL（秒）：7天
FILE_CACHE_TTL = "604800"
# 元数据缓存 TTL（秒）：1小时
META_CACHE_TTL = "3600"
# file_url 缓存 TTL（秒）：3分钟（Steam 的 file_url 有时效性）
FILEURL_CACHE_TTL = "180"

# Steam Web API Key（可选，用于搜索功能）
# 通过 wrangler secret put STEAM_API_KEY 配置
# [env.production.vars]
# STEAM_API_KEY = ""

[observability]
enabled = true
