<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杀戮尖塔2娘化MOD站</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="img-src * data:;">
    <style>
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #faf7f4; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .loading-gif { display: none; }
        .loading-spinner-main {
            width: 48px; height: 48px;
            border: 4px solid #e2dbd0; border-top-color: #e89b9b;
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text {
            display: block; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 1.1rem; color: #6b6378;
            animation: loadingPulse 1.5s ease-in-out infinite; margin-top: 10px;
        }
        .loading-spinner {
            display: inline-block; width: 1em; height: 1em;
            border: 2px solid #6b6378; border-top-color: transparent;
            border-radius: 50%; margin-left: 8px;
            animation: spin 0.8s linear infinite; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes loadingPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
    </style>
    <link rel="stylesheet" href="resources/css/style.css?v=20260520">
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="potion-wrapper" id="potionWrapper">
            <div class="potion">
                <div class="potion-liquid"></div>
                <div class="potion-bubbles">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>
        </div>
        <img class="loading-gif" id="loadingGif" alt="加载中">
        <div class="loading-spinner-main"></div>
        <span class="loading-text">正在加载 MOD 资源库<span class="loading-spinner"></span></span>
    </div>

    <div class="main-content" id="mainContent" style="opacity:0; transition: opacity 0.4s ease;">
        <header class="header">
            <div class="logo-area" id="logoArea">
                <div class="logo-tower" id="logoTower">
                    <div class="logo-layer"></div>
                    <div class="logo-layer"></div>
                    <div class="logo-layer"></div>
                </div>
                <img class="logo-img" id="logoImg" alt="鸡煲" style="display:none;">
                <h1 class="logo-title">杀戮尖塔2 娘化MOD站</h1>
            </div>
        </header>

        <nav class="quick-actions">
            <a href="resources/group/group.html" class="quick-card">
                <span class="quick-card-title">玩家交流</span>
                <span class="quick-card-desc">加入玩家群，一起交流MOD</span>
            </a>
            <a href="https://b23.tv/mjvckEc" target="_blank" rel="noopener noreferrer" class="quick-card">
                <span class="quick-card-title">关注B站</span>
                <span class="quick-card-desc">获取最新MOD动态</span>
            </a>
        </nav>

        <div class="search-section">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索 MOD 名称、标签或 RID…">
                <button id="searchClear" class="search-clear" style="display:none;">&times;</button>
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <div class="category-bar" id="categoryBar">
            <span class="category-tag active" data-category="all">MOD资源</span>
            <span class="category-tag" data-category="skin">O.o的网盘</span>
        </div>

        <div class="mod-grid" id="modGrid"></div>

        <!-- 分页器 -->
        <div class="pagination-wrap" id="paginationWrap"></div>

        <!-- 全站配置加载失败提示 -->
        <div class="manifest-error-state" id="manifestError" style="display:none;">
            <div class="manifest-error-icon">⚠️</div>
            <div class="manifest-error-text">配置加载失败，请刷新重试</div>
            <button class="retry-btn" id="manifestRetryBtn">刷新页面</button>
        </div>
    </div>

    <!-- 全屏详情弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>

            <div class="modal-header">
                <div class="modal-title-row">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <span class="modal-badge" id="modalBadge"></span>
                </div>
                <div class="modal-meta">
                    <span class="modal-author" id="modalAuthor"></span>
                    <span class="modal-date" id="modalDate"></span>
                    <span class="modal-size" id="modalSize"></span>
                </div>
                <div class="modal-rid" id="modalRid" title="点击复制">
                    RID:<span class="rid-value" id="ridValue"></span>
                </div>
                <!-- RID 复制弹窗 -->
                <div class="rid-popup" id="ridPopup">
                    <div class="rid-popup-item" data-action="copy-rid">复制 RID</div>
                    <div class="rid-popup-item" data-action="copy-link">复制帖子链接</div>
                </div>
                <div class="modal-tags" id="modalTags"></div>
            </div>

            <div class="carousel-container" id="carouselContainer">
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="carousel-btn carousel-prev" id="carouselPrev">&#8249;</button>
                <button class="carousel-btn carousel-next" id="carouselNext">&#8250;</button>
                <div class="carousel-dots" id="carouselDots"></div>
            </div>

            <div class="modal-description" id="modalDescription"></div>

            <div class="modal-downloads" id="modalDownloads"></div>

            <div class="preview-section" id="previewSection">
                <div class="preview-header">
                    <span class="preview-title">预览媒体资源选项</span>
                    <div class="preview-toggles">
                        <button class="preview-toggle" id="previewImagesBtn">预览图片 ▾</button>
                        <button class="preview-toggle" id="previewVideosBtn">预览视频 ▾</button>
                    </div>
                </div>
                <div class="preview-content-area" id="previewContentArea"></div>
            </div>
        </div>
    </div>

    <div class="lightbox-overlay" id="lightboxOverlay">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <img class="lightbox-img" id="lightboxImg" alt="查看大图">
    </div>

    <div class="chara-overlay" id="charaOverlay">
        <button class="chara-close" id="charaClose">&times;</button>
        <div class="chara-modal">
            <div class="chara-image-wrap">
                <img id="charaImg" alt="鸡煲立绘">
            </div>
            <h2 class="chara-name">故障机器人（鸡煲）</h2>
            <div class="chara-details">
                <p><strong>性别：</strong>未知</p>
                <p><strong>年龄：</strong>千年机体</p>
                <p><strong>画师：</strong>anaertailin（A大）</p>
                <p><strong>规格：</strong>全身立绘，透明底，尺寸722×1420</p>
                <p><strong>原图来源：</strong><a href="https://www.ifdian.net/album/c125877626ff11eea47652540025c377/6e1abe8c6c2011eea7b752540025c377?utm_source=copylink&utm_medium=link" target="_blank" rel="noopener noreferrer">爱发电原贴</a></p>
            </div>
            <p class="chara-desc">一具产生了自我意识的战斗型机器人。它装载的远古科技让它可以操控充能球。</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="resources/js/main.js?v=20260520" defer></script>
</body>
</html>
