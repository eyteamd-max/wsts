<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杀戮尖塔2娘化MOD站</title>
    <style>
        :root {
            --bg: #faf7f4;
            --strawberry-milk: #e89b9b;
            --strawberry-light: #f5c4c4;
            --mint-jelly: #a8d8c8;
            --mint-light: #c8ece0;
            --cream-yellow: #fbe8c3;
            --cream-light: #fdf3dc;
            --lavender: #c8b8d8;
            --lavender-light: #dfd4ea;
            --border-dark: #4a4458;
            --text-primary: #3d3648;
            --text-secondary: #6b6378;
            --text-muted: #9a92a5;
            --shadow-soft: 0 4px 20px rgba(74, 68, 88, 0.08);
            --shadow-medium: 0 8px 32px rgba(74, 68, 88, 0.13);
            --shadow-deep: 0 14px 44px rgba(74, 68, 88, 0.18);
            --radius-xl: 28px;
            --border-width: 2.5px;
            --font-title: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 15% 20%, rgba(232, 155, 155, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 78% 65%, rgba(168, 216, 200, 0.07) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 80%, rgba(200, 184, 216, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 60% 30%, rgba(251, 232, 195, 0.06) 0%, transparent 45%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* 加载动画 */
        .loading-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg);
            display: flex; align-items: center; justify-content: center; flex-direction: column;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1; visibility: visible;
        }
        .loading-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .loading-character {
            position: relative; width: 80px; height: 90px;
            animation: characterDrink 1.2s ease-in-out infinite;
        }
        .loading-head {
            width: 50px; height: 50px; background: var(--strawberry-light);
            border-radius: 50%; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            border: 3px solid var(--border-dark);
        }
        .loading-body {
            width: 38px; height: 30px; background: var(--lavender-light);
            border-radius: 50%; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            border: 3px solid var(--border-dark);
        }
        .loading-potion {
            position: absolute; width: 22px; height: 30px; background: var(--mint-jelly);
            border-radius: 12px 12px 6px 6px; top: 28px; right: -8px;
            border: 2.5px solid var(--border-dark);
            animation: potionTilt 1.2s ease-in-out infinite;
        }
        .loading-potion::after {
            content: '';
            position: absolute;
            top: -12px; left: 50%; transform: translateX(-50%);
            width: 6px; height: 6px;
            background: var(--mint-jelly);
            border-radius: 50%;
            border: 1.5px solid var(--border-dark);
            animation: bubble 1.2s ease-in-out infinite;
        }
        @keyframes bubble {
            0%,100% { transform: translateX(-50%) translateY(0); opacity: 1; }
            50% { transform: translateX(-50%) translateY(-14px); opacity: 0; }
        }
        .loading-text {
            margin-top: 20px; font-family: var(--font-title); font-size: 1.1rem;
            color: var(--text-secondary); animation: loadingPulse 1.5s ease-in-out infinite;
        }

        @keyframes characterDrink { 0%,100%{transform:translateY(0)} 25%{transform:translateY(-8px)} 50%{transform:translateY(0)} 75%{transform:translateY(-4px)} }
        @keyframes potionTilt { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-25deg)} 60%{transform:rotate(-5deg)} 85%{transform:rotate(-20deg)} }
        @keyframes loadingPulse { 0%,100%{opacity:0.6} 50%{opacity:1} }

        .main-container { max-width: 1100px; margin: 0 auto; padding: 24px 28px 60px; }

        .header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-bottom: 28px; }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }
        .logo-img {
            max-height: 100px;
            width: auto;
            display: block;
            border-radius: 16px;
            object-fit: contain;
        }
        .logo-tower {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .logo-layer {
            border-radius: 50%;
            border: 3px solid var(--border-dark);
        }
        .logo-layer:nth-child(1) { width:44px; height:44px; background:var(--strawberry-light); z-index:3; }
        .logo-layer:nth-child(2) { width:52px; height:52px; background:var(--cream-yellow); margin-top:-6px; z-index:2; }
        .logo-layer:nth-child(3) { width:60px; height:60px; background:var(--mint-light); margin-top:-7px; z-index:1; }

        .logo-title {
            font-family: var(--font-title);
            font-size: 1.55rem;
            font-weight: 700;
            white-space: nowrap;
            letter-spacing: 0.03em;
            position: relative;
        }
        .logo-title::after {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--strawberry-milk);
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
            animation: dotPulse 2s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.8); opacity: 0.3; }
        }

        .search-wrapper { flex:1; min-width:300px; max-width:520px; position: relative; }
        .search-container { position: relative; z-index: 50; }

        .search-input {
            width:100%; padding:15px 52px 15px 24px; font-size:0.98rem;
            border:var(--border-width) solid var(--border-dark); border-radius:50px;
            background:#fffdfb; color:var(--text-primary); outline:none;
            transition:all 0.3s; box-shadow:var(--shadow-soft);
        }
        .search-input:focus { box-shadow:var(--shadow-deep); border-color:var(--strawberry-milk); }

        .search-mascot {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            pointer-events: none;
        }
        .search-mascot::before,
        .search-mascot::after {
            content: '';
            position: absolute;
            background: var(--strawberry-light);
            border: 2px solid var(--border-dark);
            border-radius: 50%;
        }
        .search-mascot::before {
            width: 18px;
            height: 18px;
            top: 2px;
            left: 5px;
            animation: mascotPeek 2.5s ease-in-out infinite;
        }
        .search-mascot::after {
            width: 10px;
            height: 10px;
            bottom: 0;
            right: 2px;
            background: var(--cream-yellow);
        }

        @keyframes mascotPeek {
            0%,100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
            60% { transform: translateY(2px); }
            85% { transform: translateY(-4px); }
        }

        .search-dropdown {
            position:absolute; top:calc(100% + 8px); left:8px; right:8px;
            background:#fffdfb; border:var(--border-width) solid var(--border-dark);
            border-radius:22px; box-shadow:var(--shadow-medium);
            z-index:200; max-height:260px; overflow-y:auto;
            opacity:0; visibility:hidden; transform:translateY(-8px);
            transition:all 0.25s; list-style:none; padding:6px 0;
        }
        .search-dropdown.active { opacity:1; visibility:visible; transform:translateY(0); }
        .search-dropdown-item { padding:11px 20px; cursor:pointer; font-size:0.93rem; color:var(--text-primary); }
        .search-dropdown-item:hover { background:#fef0f0; color:#c97a7a; }

        .category-tags {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 16px; margin-top: 18px;
        }
        .category-tag {
            position: relative;
            min-width: 140px;
            justify-content: center;
            display: inline-flex; align-items: center;
            padding: 10px 20px;
            background: #fffdfb;
            border: var(--border-width) solid var(--border-dark);
            border-radius: 30px 30px 22px 22px;
            cursor: pointer;
            font-size: 0.88rem; font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s var(--transition-bounce);
            user-select: none; box-shadow: var(--shadow-soft);
        }
        .category-tag::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--mint-light);
            border: 2px solid var(--border-dark);
            border-radius: 50%;
            margin-right: 8px;
            transition: background 0.3s;
        }
        .category-tag.active {
            background: var(--strawberry-light);
            color: #fff;
            border-color: #c97a7a;
        }
        .category-tag.active::before {
            background: #fff;
            border-color: #c97a7a;
        }

        .quick-actions { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:36px; }
        .quick-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 26px 18px; border: var(--border-width) solid var(--border-dark);
            border-radius: var(--radius-xl); text-align: center; text-decoration: none;
            color: var(--text-primary); font-weight: 600;
            box-shadow: var(--shadow-soft); transition: all 0.35s var(--transition-bounce);
            position: relative;
            overflow: hidden;
        }
        .quick-card:nth-child(1) { background: #fff5f5; }
        .quick-card:nth-child(2) { background: #f4faf8; }
        .quick-card:nth-child(3) { background: #fffef5; }
        .quick-card:nth-child(4) { background: #f8f6fc; }
        .quick-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: var(--shadow-deep); }
        .quick-card::after {
            content: '';
            position: absolute;
            top: -20px; right: -20px;
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.5s ease;
        }
        .quick-card:hover::after {
            transform: scale(4);
            opacity: 0;
        }
        .quick-card-title { font-family: var(--font-title); font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; position: relative; z-index: 1; }
        .quick-card-desc { font-size: 0.85rem; color: var(--text-secondary); font-weight: 500; position: relative; z-index: 1; }

        .mod-section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-left: 16px;
            border-left: 6px solid var(--strawberry-milk);
            position: relative;
            display: inline-block;
        }
        .mod-section-title::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 40px;
            height: 4px;
            background: var(--mint-jelly);
            border-radius: 2px;
        }

        .mod-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; margin-bottom:40px; }
        .mod-card {
            background:#fffdfb; border:var(--border-width) solid var(--border-dark);
            border-radius:var(--radius-xl); overflow:hidden;
            transition:all 0.35s var(--transition-bounce); box-shadow:var(--shadow-soft);
            cursor:pointer; position:relative;
        }
        .mod-card:hover { transform:translateY(-7px) scale(1.02); box-shadow:var(--shadow-deep); }
        .mod-cover { position:relative; height:180px; overflow:hidden; border-bottom:var(--border-width) solid var(--border-dark); }
        .mod-cover-inner { width:100%; height:100%; position:relative; }
        .mod-cover-gradient { width:100%; height:100%; position:absolute; }
        .mod-cover-char { position:absolute; z-index:1; font-size:4rem; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .mod-cover-img { position:absolute; width:100%; height:100%; object-fit:cover; z-index:2; border-radius:inherit; }
        .mod-badge {
            position:absolute; top:12px; right:12px; z-index:5;
            background:#fffdfb; border:2px solid var(--border-dark); border-radius:20px;
            padding:5px 12px; font-size:0.75rem; font-weight:700; transform:rotate(6deg);
        }
        .mod-info { padding:16px 18px; }
        .mod-title { font-weight:700; font-size:1.05rem; margin-bottom:8px; }
        .mod-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
        .mod-meta-tag {
            padding:5px 14px; background:#f5f2f8; border:2px solid #ddd8e5;
            border-radius:20px; font-size:0.78rem; color:var(--text-secondary);
        }
        .mod-download-btn {
            display:inline-block; padding:11px 26px; background:var(--strawberry-milk);
            color:#fff; border:var(--border-width) solid #c97a7a; border-radius:30px;
            font-weight:700; cursor:pointer; transition:all 0.3s var(--transition-bounce);
        }
        .mod-download-btn:hover { background:#fff; color:var(--strawberry-milk); transform:scale(1.07); }

        .footer { text-align:center; padding:30px 4px 20px; color:var(--text-muted); font-size:0.9rem; }

        @media (max-width: 900px) {
            .quick-actions { grid-template-columns: repeat(2,1fr); }
            .mod-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width:100%; }
        }
    </style>
</head>
<body>

    <!-- 加载动画 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-character">
            <div class="loading-head"></div>
            <div class="loading-body"></div>
            <div class="loading-potion"></div>
        </div>
        <p class="loading-text">药水咕嘟咕嘟...马上就好</p>
    </div>

    <div class="main-container" id="mainContent">
        <header class="header">
            <div class="logo-area">
                <img src="Lihui.gif" 
                     alt="尖塔少女立绘" 
                     class="logo-img" 
                     id="logoImg"
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="logo-tower" style="display:none;">
                    <div class="logo-layer"></div>
                    <div class="logo-layer"></div>
                    <div class="logo-layer"></div>
                </div>
                <span class="logo-title">STS2娘化MOD站</span>
            </div>

            <div class="search-wrapper">
                <div class="search-container" id="searchContainer">
                    <input type="text" class="search-input" id="searchInput" placeholder="输入MOD名或角色名，寻找你的爬塔伙伴..." autocomplete="off">
                    <span class="search-mascot"></span>
                    <ul class="search-dropdown" id="searchDropdown"></ul>
                </div>
                <div class="category-tags" id="categoryTags">
                    <span class="category-tag active" data-category="all">全部MOD</span>
                    <span class="category-tag" data-category="skin">全员娘化</span>
                </div>
            </div>
        </header>

        <!-- 快捷入口 -->
        <section class="quick-actions">
            <a href="#" class="quick-card">
                <span class="quick-card-title">新手必看</span>
                <span class="quick-card-desc">MOD安装教程 PC、Android</span>
            </a>
            <a href="#" class="quick-card">
                <span class="quick-card-title">STS2手机版</span>
                <span class="quick-card-desc">wsdx233大佬的网盘链接</span>
            </a>
            <a href="#" class="quick-card">
                <span class="quick-card-title">问题反馈</span>
                <span class="quick-card-desc">资源失效？点这里告诉管理员</span>
            </a>
            <a href="#" class="quick-card">
                <span class="quick-card-title">玩家交流</span>
                <span class="quick-card-desc">加入玩家群，一起交流MOD</span>
            </a>
        </section>

        <!-- MOD 资源列表 -->
        <section>
            <h2 class="mod-section-title">精选MOD资源</h2>
            <div class="mod-grid" id="modGrid"></div>
        </section>

        <footer class="footer">
            <p>STS2娘化MOD站 © 2026 壹个屑猫猫</p>
        </footer>
    </div>

    <script>
        (function() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            const mainContent = document.getElementById('mainContent');
            mainContent.style.opacity = '0';
            mainContent.style.transition = 'opacity 0.5s ease';

            window.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    loadingOverlay.classList.add('hidden');
                    mainContent.style.opacity = '1';
                }, 1500);
            });

            let modData = [];
            let activeCategory = 'all';
            const modGrid = document.getElementById('modGrid');
            const searchInput = document.getElementById('searchInput');
            const searchDropdown = document.getElementById('searchDropdown');
            const searchContainer = document.getElementById('searchContainer');

            const dataSources = { all: 'mods.json', skin: 'skins.json' };
            const dataCache = {};

            function renderModCards(dataArray) {
                modGrid.innerHTML = '';
                if (dataArray.length === 0) {
                    modGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px; color:var(--text-muted);">没有找到相关MOD，试试其他关键词吧</div>`;
                    return;
                }
                dataArray.forEach(mod => {
                    const card = document.createElement('div');
                    card.className = 'mod-card';
                    const hasCoverImg = mod.coverImage && mod.coverImage.trim() !== '';
                    card.innerHTML = `
                        <div class="mod-cover">
                            <div class="mod-cover-inner">
                                <div class="mod-cover-gradient" style="background:${mod.coverGradient};"></div>
                                ${hasCoverImg ? `
                                    <img src="${mod.coverImage}" alt="${mod.title}" class="mod-cover-img"
                                         onerror="this.onerror=null; this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%239a92a5' stroke-width='3'><circle cx='24' cy='24' r='20'/><path d='M24 16v12'/><circle cx='24' cy='32' r='2' fill='%239a92a5'/></svg>`)}'; this.style.opacity=0.4;"
                                         style="position:absolute; width:100%; height:100%; object-fit:cover; z-index:2;">
                                ` : ''}
                                <span class="mod-cover-char" style="${hasCoverImg ? 'display:none;' : 'z-index:1;'}">${mod.coverChar}</span>
                            </div>
                            <span class="mod-badge ${mod.badgeClass}">${mod.badge}</span>
                        </div>
                        <div class="mod-info">
                            <div class="mod-title">${mod.title}</div>
                            <div class="mod-meta">
                                <span class="mod-meta-tag">大小 ${mod.size}</span>
                                <span class="mod-meta-tag">日期 ${mod.date}</span>
                            </div>
                            <button class="mod-download-btn">点击下载</button>
                        </div>`;
                    card.querySelector('.mod-download-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        alert(`正在准备下载：${mod.title}`);
                    });
                    modGrid.appendChild(card);
                });
            }

            function filterMods() {
                let filtered = [...modData];
                if (activeCategory !== 'all') {
                    filtered = filtered.filter(m => m.category === activeCategory);
                }
                const query = searchInput.value.trim().toLowerCase();
                if (query) {
                    filtered = filtered.filter(m => m.title.toLowerCase().includes(query));
                }
                renderModCards(filtered);
                updateSearchDropdown(query);
            }

            function updateSearchDropdown(query) {
                searchDropdown.innerHTML = '';
                if (!query || query.length < 1) {
                    searchDropdown.classList.remove('active');
                    return;
                }
                const matches = modData.filter(m => m.title.toLowerCase().includes(query.toLowerCase()));
                if (matches.length === 0) {
                    searchDropdown.innerHTML = '<li style="padding:16px;text-align:center;color:var(--text-muted);">没有找到相关MOD</li>';
                } else {
                    matches.slice(0, 8).forEach(m => {
                        const li = document.createElement('li');
                        li.className = 'search-dropdown-item';
                        li.innerHTML = m.title.replace(new RegExp(`(${query})`, 'gi'), '<mark>$1</mark>');
                        li.addEventListener('click', () => {
                            searchInput.value = m.title;
                            searchDropdown.classList.remove('active');
                            filterMods();
                        });
                        searchDropdown.appendChild(li);
                    });
                }
                searchDropdown.classList.add('active');
            }

            async function loadModData(categoryKey = 'all') {
                const url = dataSources[categoryKey];
                if (!url) return;
                modGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;">正在准备萌物清单...</div>';
                try {
                    if (dataCache[url]) {
                        modData = dataCache[url];
                    } else {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error('加载失败');
                        modData = await response.json();
                        dataCache[url] = modData;
                    }
                    searchInput.value = '';
                    searchDropdown.classList.remove('active');
                    renderModCards(modData);
                } catch (error) {
                    modGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;">MOD数据加载失败，请稍后再试</div>';
                }
            }

            document.getElementById('categoryTags').addEventListener('click', (e) => {
                const tag = e.target.closest('.category-tag');
                if (!tag) return;
                document.querySelectorAll('.category-tag').forEach(t => t.classList.remove('active'));
                tag.classList.add('active');
                activeCategory = tag.getAttribute('data-category') || 'all';
                loadModData(activeCategory);
            });

            searchInput.addEventListener('input', filterMods);
            searchInput.addEventListener('focus', () => {
                if (searchInput.value.trim().length >= 1) updateSearchDropdown(searchInput.value.trim());
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { searchDropdown.classList.remove('active'); searchInput.blur(); }
                if (e.key === 'Enter')  { searchDropdown.classList.remove('active'); filterMods(); }
            });
            document.addEventListener('click', (e) => {
                if (!searchContainer.contains(e.target)) searchDropdown.classList.remove('active');
            });

            window.addEventListener('DOMContentLoaded', () => {
                loadModData('all');
            });
        })();
    </script>
</body>
</html>
