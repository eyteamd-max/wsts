<div class="mb-5 anim-fade-up" style="animation-delay:.06s">
<div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm px-5 py-4">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-indigo-50 flex items-center justify-center shrink-0">

<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
仓库
</a>
</div>
</div>
</div>

<div id="error-card" class="hidden mb-6">
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8 text-center">
<div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3">
<svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
</div>
<p id="error-title" class="text-sm font-medium text-slate-700 mb-1">参数错误</p>
<p id="error-desc" class="text-xs text-slate-400 mb-4">请提供有效的 GitHub 仓库链接作为 url 参数</p>
<div class="text-xs text-slate-500 bg-slate-50 rounded-lg p-3 text-left font-mono break-all">
示例: https://axxxx.cyou/resources/github_parsing/?url=https://github.com/owner/repo
</div>
</div>
</div>

<div id="download-card" class="hidden mb-6"></div>

<footer class="text-center anim-fade" style="animation-delay:.2s">
<a href="../../index.html" class="footer-text text-slate-400">GH Releases 解析 / STS2娘化MOD站 © 2026 壹个屑猫猫</a>
</footer>
</div>

<script>
var MY_PROXY_URL = 'https://dl.axxxx.cyou/';

function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function parseGitHubRepoUrl(url) {
  if (!url) return null;
  var match = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/?/);
  if (match && match[1] && match[2]) {
    return { owner: match[1], repo: match[2], fullName: match[1] + '/' + match[2] };
  }
  return null;
}

var GITHUB_RELEASE_URL = '';
var GITHUB_REPO_URL = '';
var RELEASE = {
  version: '-',
  publishedAt: '-',
  author: '-',
  fileName: '-',
  fileSize: '-',
  downloadCount: '-',
  htmlUrl: '-'
};

async function fetchRelease(repoInfo) {
  try {
    var apiUrl = 'https://api.github.com/repos/' + repoInfo.fullName + '/releases/latest';
    var r = await fetch(apiUrl, {headers: {'Accept': 'application/vnd.github.v3+json'}});
    if (!r.ok) throw new Error('GitHub API 请求失败: ' + r.status);
    var d = await r.json();
    if (d.tag_name) RELEASE.version = d.tag_name;
    if (d.published_at) {
      var dt = new Date(d.published_at);
      RELEASE.publishedAt = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
    }
    if (d.author && d.author.login) RELEASE.author = d.author.login;
    if (d.html_url) RELEASE.htmlUrl = d.html_url;
    if (d.assets && d.assets.length > 0) {
      var a = d.assets[0];
      if (a.name) RELEASE.fileName = a.name;
      if (a.size) RELEASE.fileSize = (a.size / 1048576).toFixed(2) + ' MB';
      if (typeof a.download_count === 'number') RELEASE.downloadCount = a.download_count.toLocaleString();
      if (a.browser_download_url) GITHUB_RELEASE_URL = a.browser_download_url;
    }
    document.getElementById('header-filename').textContent = RELEASE.fileName;
    document.getElementById('header-size').textContent = RELEASE.fileSize;
    document.getElementById('header-repo').textContent = repoInfo.fullName;
    var repoLink = document.getElementById('header-repo-link');
    repoLink.href = GITHUB_REPO_URL;
    repoLink.classList.remove('hidden');
    return true;
  } catch (e) {
    console.error(e);
    document.getElementById('error-title').textContent = '获取仓库信息失败';
    document.getElementById('error-desc').textContent = '无法获取该仓库的最新 Release 信息，请检查链接是否正确或仓库是否存在。';
    document.getElementById('error-card').classList.remove('hidden');
    return false;
  }
}

function renderDownloadCard() {
  var proxyDownloadUrl = MY_PROXY_URL + GITHUB_RELEASE_URL;

  var html = '<div class="anim-fade-up"><div class="bg-white rounded-2xl border border-indigo-100 shadow-sm overflow-hidden">';
  html += '<div class="px-6 pt-5 pb-4"><div class="flex items-center gap-2.5 mb-4">';
  html += '<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-600 text-xs font-semibold whitespace-nowrap">自建接口 勿滥用</span>';
  html += '<span class="inline-flex items-center px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-600 text-xs font-semibold whitespace-nowrap">以获取到最新版本</span>';
  html += '</div>';
  html += '<h2 class="text-lg font-bold text-slate-900 mb-0.5">' + RELEASE.fileName + '</h2>';
  html += '<p class="text-sm text-slate-400">' + RELEASE.version + '</p></div>';

  html += '<div class="px-6 pb-5"><div class="grid grid-cols-2 sm:grid-cols-4 gap-3">';
  html += '<div class="meta-card px-3 py-2.5 rounded-xl border border-slate-100"><div class="text-xs text-slate-400 mb-0.5">版本</div><div class="text-sm font-medium text-slate-700 truncate">' + RELEASE.version + '</div></div>';
  html += '<div class="meta-card px-3 py-2.5 rounded-xl border border-slate-100"><div class="text-xs text-slate-400 mb-0.5">更新时间</div><div class="text-sm font-medium text-slate-700 truncate">' + RELEASE.publishedAt + '</div></div>';
  html += '<div class="meta-card px-3 py-2.5 rounded-xl border border-slate-100"><div class="text-xs text-slate-400 mb-0.5">作者</div><div class="text-sm font-medium text-slate-700 truncate">' + RELEASE.author + '</div></div>';
  html += '<div class="meta-card px-3 py-2.5 rounded-xl border border-slate-100"><div class="text-xs text-slate-400 mb-0.5">大小</div><div class="text-sm font-medium text-slate-700 truncate">' + RELEASE.fileSize + '</div></div>';
  html += '</div></div>';

  html += '<div class="border-t border-slate-100 px-6 py-4">';
  html += '<div class="flex flex-wrap items-center gap-2.5">';
  html += '<a href="' + proxyDownloadUrl + '" target="_blank" rel="noopener" class="btn-primary inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-medium whitespace-nowrap shadow-md shadow-indigo-500/15"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>立即高速下载</a>';
  html += '<a href="' + RELEASE.htmlUrl + '" target="_blank" rel="noopener" class="btn-outline inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium whitespace-nowrap"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>在 GitHub 中查看</a>';
  html += '</div></div>';
  html += '</div></div>';

  document.getElementById('download-card').innerHTML = html;
  document.getElementById('download-card').classList.remove('hidden');
}

window.addEventListener('DOMContentLoaded', async function() {
  var urlParam = getQueryParam('url');
  var repoInfo = parseGitHubRepoUrl(urlParam);
  if (!repoInfo) {
    document.getElementById('error-card').classList.remove('hidden');
    return;
  }
  GITHUB_REPO_URL = 'https://github.com/' + repoInfo.fullName;
  var success = await fetchRelease(repoInfo);
  if (success) {
    renderDownloadCard();
  }
});
</script>
</body>
