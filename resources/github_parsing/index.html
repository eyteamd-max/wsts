<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Releases 解析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
    @keyframes cardReveal{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes tickPulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
    @keyframes dotWave{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
    .anim-fade-up{animation:fadeInUp .5s cubic-bezier(.16,1,.3,1) both}
    .anim-fade{animation:fadeIn .4s ease both}
    .anim-card{animation:cardReveal .6s cubic-bezier(.16,1,.3,1) both}
    .shimmer-bar{background:linear-gradient(90deg,#c7d2fe 25%,#a5b4fc 50%,#c7d2fe 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
    .pulse-dot{animation:pulseDot 1.2s ease-in-out infinite}
    .tick-pulse{animation:tickPulse 1s ease-in-out infinite}
    .typing-dots{display:inline-flex;gap:1px;margin-left:2px;vertical-align:1px}
    .typing-dots span{font-size:13px;font-weight:700;color:#94a3b8;opacity:.2;animation:dotWave 1.2s ease-in-out infinite}
    .typing-dots span:nth-child(1){animation-delay:0s}
    .typing-dots span:nth-child(2){animation-delay:.15s}
    .typing-dots span:nth-child(3){animation-delay:.3s}
    .speed-bar{transition:width .7s cubic-bezier(.16,1,.3,1)}
    .btn-primary{transition:all .2s cubic-bezier(.16,1,.3,1)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,70,229,.25)}
    .btn-primary:active{transform:translateY(0)}
    .btn-outline{transition:all .15s ease}
    .btn-outline:hover{background:#f8fafc}
    .btn-ghost{transition:all .15s ease}
    .btn-ghost:hover{background:#f1f5f9}
    .meta-card{transition:background .15s ease}
    .meta-card:hover{background:#f8fafc}
    .route-row{transition:all .15s ease}
    .route-row:hover{border-color:#cbd5e1;background:#fafbfc}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#cbd5e1}
    /* ===== 排序动画专用 ===== */
    .live-row {
      /* 确保行元素参与 FLIP 位移动画 */
      will-change: transform;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 antialiased">
<div class="max-w-2xl mx-auto px-4 pt-8 pb-14">
  <!-- Top Status -->
  <div id="top-status" class="mb-5 anim-fade-up min-h-[20px]">
    <p class="text-xs leading-relaxed"><span class="typing-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </div>

  <!-- File Header -->

    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm px-5 py-4">

          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          仓库

      </div>

  <!-- Testing Status -->
  <div id="testing-status" class="mb-6 anim-fade-up hidden" style="animation-delay:.12s">
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-5">

  <div id="no-routes" class="hidden mb-6">

      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>

  <footer class="text-center anim-fade" style="animation-delay:.2s">

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2.5 rounded-xl bg-slate-800 text-white text-sm font-medium shadow-xl hidden z-50 whitespace-nowrap"></div>

<script>
/* ============================================================
 * 优化版测速核心
 * ============================================================ */
var GITHUB_PROXIES = [
  {name:'GitHub 官方',url:'',desc:'官源 · 推荐-需科学上网'},
  {name:'gh-proxy.com',url:'https://gh-proxy.com/',desc:'推荐 · 稳定'},
  {name:'ghproxy.net',url:'https://ghproxy.net/',desc:'老牌节点'},
  {name:'github.tbedu.top',url:'https://github.tbedu.top/',desc:'国内节点'},
  {name:'cdn.gh-proxy.com',url:'https://cdn.gh-proxy.com/',desc:'CDN 节点'},
  {name:'gh.inkchills.cn',url:'https://gh.inkchills.cn/',desc:'国内节点'},
  {name:'tvv.tw',url:'https://tvv.tw/',desc:'台湾节点'},
  {name:'gh.catmak.name',url:'https://gh.catmak.name/',desc:'海外节点'},
  {name:'gh.sixyin.com',url:'https://gh.sixyin.com/',desc:'备用节点'},
  {name:'gh.idayer.com',url:'https://gh.idayer.com/',desc:'国内推荐'},
  {name:'cors.isteed.cc',url:'https://cors.isteed.cc/',desc:'开源常用'}
];

/* ===== 动态配置 ===== */
var GITHUB_RELEASE_URL = ''; // 将由 fetchRelease 填充
var GITHUB_REPO_URL = '';
var RELEASE = {
  version: '-',
  publishedAt: '-',
  author: '-',
  fileName: '-',
  fileSize: '-',
  downloadCount: '-',
  htmlUrl: '-'
};

var proxyResults=[];
var isTesting=false;

/* ===== 可调参数 ===== */
var LATENCY_TIMEOUT = 5000;
var SPEED_TIMEOUT = 5000;
var PING_COUNT = 3;
var PING_INTERVAL = 100;
var LATENCY_CUTOFF = 4000;

/* ===== 新增：URL 参数解析与验证 ===== */
function getQueryParam(name) {
  var params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function parseGitHubRepoUrl(url) {
  if (!url) return null;
  // 匹配 https://github.com/owner/repo 格式，允许后面有 /
  var match = url.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/?/);
  if (match && match[1] && match[2]) {
    return {
      owner: match[1],
      repo: match[2],
      fullName: match[1] + '/' + match[2]
    };
  }
  return null;
}

/* ===== 顶部状态栏逐字打字动画 ===== */
var _segs=[], _vis=0, _timer=null, _phase='latency';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function totalLen(){var n=0;for(var i=0;i<_segs.length;i++){if(i>0)n+=3;n+=_segs[i].text.length;}return n;}
function initTopStatus(){_segs=[{text:'正在从Github开源库查找最新版本...',cls:'text-slate-400'}];_vis=0;_phase='latency';clearTimeout(_timer);renderTop();}
function ensureSeg(idx){var n=0;for(var i=0;i<=idx&&i<_segs.length;i++){if(i>0)n+=3;n+=_segs[i].text.length;}clearTimeout(_timer);if(_vis<n){_vis=n;renderTop();}}
function smoothTo(target){clearTimeout(_timer);if(_vis>=target)return;(function step(){if(_vis<target){_vis++;renderTop();var rem=target-_vis;_timer=setTimeout(step,rem>25?8:rem>12?28:rem>5?48:65);}})();}
function syncTyping(pct){if(_phase==='latency'&&_segs.length>0){var len=_segs[0].text.length;smoothTo(Math.max(0,Math.min(Math.round(len*pct/100),len)));}else if(_phase==='speed'&&_segs.length>1){var s1=_segs[0].text.length,s2=_segs[1].text.length,s2t=Math.max(0,Math.min(Math.round(s2*pct/100),s2));smoothTo(s1+3+s2t);}}
function fastTypeToEnd(){return new Promise(function(resolve){clearTimeout(_timer);var target=totalLen();(function step(){if(_vis<target){_vis++;renderTop();_timer=setTimeout(step,36);}else{renderTop();resolve();}})();});}
function addSegAndType(text,cls){_segs.push({text:text,cls:cls||'text-slate-400'});return fastTypeToEnd();}
function addSeg(text,cls){_segs.push({text:text,cls:cls||'text-slate-400'});}
function renderTop(){var c=document.getElementById('top-status'),total=totalLen(),typing=_vis<total,html='<p class="text-xs leading-relaxed">',ci=0;for(var i=0;i<_segs.length;i++){var sep=i>0?' / ':'',segText=sep+_segs[i].text;if(_vis<=ci)break;var vc=Math.min(segText.length,_vis-ci);if(i>0&&vc>0){var sepLen=Math.min(3,vc);html+='<span class="text-slate-300 mx-0.5">'+esc(sep.substring(0,sepLen))+'</span>';if(vc>3)html+='<span class="'+_segs[i].cls+'">'+esc(segText.substring(3,vc))+'</span>';}else{html+='<span class="'+_segs[i].cls+'">'+esc(segText.substring(0,vc))+'</span>';}ci+=segText.length;}if(typing)html+='<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>';html+='</p>';c.innerHTML=html;}

/* ===== 计时器 ===== */
var _t0=0,_tid=null;
function startTimer(){_t0=performance.now();var e=document.getElementById('elapsed-time');e.textContent='0.0s';clearInterval(_tid);_tid=setInterval(function(){e.textContent=((performance.now()-_t0)/1000).toFixed(1)+'s';},100);}
function stopTimer(){clearInterval(_tid);var s=((performance.now()-_t0)/1000).toFixed(1);document.getElementById('elapsed-time').textContent=s+'s';return s;}

/* ===== GitHub API ===== */
var releaseFetched=false;
var currentRepoInfo = null; // 存储解析后的仓库信息

async function fetchRelease(){
  if (!currentRepoInfo) return;
  try{
    var apiUrl = 'https://api.github.com/repos/' + currentRepoInfo.fullName + '/releases/latest';
    var r=await fetch(apiUrl, {headers:{'Accept':'application/vnd.github.v3+json'}});
    if(!r.ok) {
      // 如果 API 请求失败，比如仓库不存在或无 Release
      throw new Error('GitHub API 请求失败: ' + r.status);
    }
    var d=await r.json();
    if(d.tag_name)RELEASE.version=d.tag_name;
    if(d.published_at){var dt=new Date(d.published_at);RELEASE.publishedAt=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}
    if(d.author&&d.author.login)RELEASE.author=d.author.login;
    if(d.html_url)RELEASE.htmlUrl=d.html_url;
    if(d.assets&&d.assets.length>0){
      var a=d.assets[0];
      if(a.name)RELEASE.fileName=a.name;
      if(a.size)RELEASE.fileSize=(a.size/1048576).toFixed(2)+' MB';
      if(typeof a.download_count==='number')RELEASE.downloadCount=a.download_count.toLocaleString();
      if(a.browser_download_url) {
        GITHUB_RELEASE_URL = a.browser_download_url; // 关键：更新测速目标URL
      }
    }
    releaseFetched=true;
    // 更新 UI
    var n=document.getElementById('header-filename');
    if(n)n.textContent=RELEASE.fileName;
    var s=document.getElementById('header-size');
    if(s)s.textContent=RELEASE.fileSize;
    var p=document.getElementById('header-repo');
    if(p)p.textContent=currentRepoInfo.fullName;
    var repoLink = document.getElementById('header-repo-link');
    if(repoLink) {
      repoLink.href = GITHUB_REPO_URL;
      repoLink.classList.remove('hidden');
    }
    var directLink = document.getElementById('direct-release-link');
    if(directLink) {
      directLink.href = GITHUB_REPO_URL + '/releases/latest';
    }
  }catch(e){
    console.error('获取 Release 信息失败:', e);
    // 显示错误提示
    document.getElementById('testing-status').classList.add('hidden');
    document.getElementById('live-list').classList.add('hidden');
    var errorCard = document.getElementById('error-card');
    document.getElementById('error-title').textContent = '获取仓库信息失败';
    document.getElementById('error-desc').textContent = '无法获取该仓库的最新 Release 信息，请检查链接是否正确或仓库是否存在。';
    errorCard.classList.remove('hidden');
    throw e; // 抛出错误，阻止后续测速
  }
}

/* ===== 核心测速 ===== */
async function measureLatency(url,timeout){
  timeout=timeout||LATENCY_TIMEOUT;
  var s=performance.now(),c=new AbortController(),t=setTimeout(function(){c.abort();},timeout);
  try{await fetch(url+(url.indexOf('?')>-1?'&':'?')+'_t='+Date.now(),{method:'HEAD',mode:'no-cors',signal:c.signal});clearTimeout(t);return{success:true,latency:Math.round(performance.now()-s)};}
  catch(e){clearTimeout(t);return{success:false,latency:timeout,error:e.name==='AbortError'?'超时':'失败'};}
}

function measureSpeedByMultiplePings(proxyUrl){
  return new Promise(function(resolve){
    var pings=[],count=0,maxP=PING_COUNT,testUrl=proxyUrl+GITHUB_RELEASE_URL;
    function doPing(){
      if(count>=maxP){
        var vp=pings.filter(function(p){return p<10000;});
        if(!vp.length){resolve({success:false,speed:0,error:'全部超时'});return;}
        var sorted=vp.slice().sort(function(a,b){return a-b;});
        if(sorted.length>2)sorted=sorted.slice(1,-1);
        var median=sorted[Math.floor(sorted.length/2)];
        var avg=vp.reduce(function(a,b){return a+b;},0)/vp.length;
        var v=vp.reduce(function(a,b){return a+Math.pow(b-avg,2);},0)/vp.length;
        var st=Math.sqrt(v)/avg;
        var bs=0;
        if(median<300)bs=2500;else if(median<500)bs=1500;else if(median<1000)bs=800;else if(median<2000)bs=300;else if(median<5000)bs=100;else bs=20;
        var f=Math.max(.5,1-st);var sp=bs*f;
        resolve({success:true,speed:parseFloat(sp.toFixed(0)),stability:parseFloat(st.toFixed(2)),note:vp.length+'次采样 · 稳定性'+parseFloat(st.toFixed(2))});return;
      }
      var s=performance.now(),c=new AbortController(),t=setTimeout(function(){c.abort();},SPEED_TIMEOUT);
      fetch(testUrl+'?_t='+Date.now()+'_'+count,{method:'HEAD',mode:'no-cors',signal:c.signal})
      .then(function(){clearTimeout(t);pings.push(performance.now()-s);count++;setTimeout(doPing,PING_INTERVAL);})
      .catch(function(){clearTimeout(t);pings.push(10000);count++;setTimeout(doPing,PING_INTERVAL);});
    }
    doPing();
  });
}

/* ===== 评分 ===== */
function getScore(l,s){var ls=Math.max(0,100-(l/5000)*100);var ss=Math.min(100,(s/3072)*100);return Math.round(ls*.3+ss*.7);}
function scoreColor(s){if(s>=80)return{bg:'bg-emerald-50',text:'text-emerald-600'};if(s>=60)return{bg:'bg-amber-50',text:'text-amber-600'};if(s>=30)return{bg:'bg-orange-50',text:'text-orange-600'};return{bg:'bg-red-50',text:'text-red-600'};}
function latencyLabel(ms){if(ms<500)return{text:'极速',cls:'text-emerald-600'};if(ms<2000)return{text:'可用',cls:'text-amber-600'};return{text:'较慢',cls:'text-orange-600'};}

/* ===== UI 辅助 ===== */
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');t.style.animation='fadeInUp .3s ease';clearTimeout(t._t);t._t=setTimeout(function(){t.style.animation='fadeIn .25s ease reverse forwards';setTimeout(function(){t.classList.add('hidden');},250);},2000);}
function showProgress(label,cur,total){document.getElementById('progress-label').textContent=label;document.getElementById('progress-count').textContent=cur+' / '+total;var pct=Math.round(cur/total*100);document.getElementById('progress-bar').style.width=pct+'%';syncTyping(pct);}
function setStatus(t){document.getElementById('status-text').textContent=t;}

/* ============================================================
 * 实时列表 —— FLIP 排序动画版
 * 核心改动：持久化 DOM 元素，增量更新内容，FLIP 动画实现排序位移
 * ============================================================ */
var _rowMap = {}; // idx -> DOM 元素映射
var _listReady = false; // 列表是否已初始化
var _flipCleanup = null; // FLIP 动画清理定时器

/* 判断行当前阶段 */
function _getPhase(item) {
  if (item._skip) return 'skipped';
  if (item._tl) return 'testing-latency';
  if (item._ts) return 'testing-speed';
  if (item._ld && !item.latencySuccess) return 'failed';
  if (item._ld && !item._sd) return 'latency-done';
  if (item._sd) return item.speedSuccess ? 'speed-done' : 'failed';
  return 'waiting';
}

/* 生成状态区域 HTML */
function _statusHtml(item, phase) {
  if (phase === 'waiting') return '<span class="text-xs text-slate-300">等待中</span>';
  if (phase === 'testing-latency') return '<span class="text-xs text-indigo-500 font-medium">测延迟中...</span>';
  if (phase === 'testing-speed') return '<span class="text-xs text-indigo-500 font-medium">测速度中...</span>';
  if (phase === 'skipped') return '<span class="text-xs text-slate-300">延迟过高，已跳过</span>';
  if (phase === 'latency-done') {
    return item.latencySuccess ? '<span class="text-xs font-mono ' + latencyLabel(item.latency).cls + '">' + item.latency + 'ms</span>' : '<span class="text-xs text-red-400">不可用</span>';
  }
  if (phase === 'speed-done') {
    return item.speedSuccess ? '<span class="text-xs font-mono text-slate-600">' + (item.speed >= 1024 ? (item.speed / 1024).toFixed(1) + ' MB/s' : item.speed + ' KB/s') + '</span>' : '<span class="text-xs text-red-400">失败</span>';
  }
  if (phase === 'failed') return '<span class="text-xs text-red-400">不可用</span>';
  return '';
}

/* 行的额外 CSS class（透明度等） */
function _rowOpacityClass(phase) {
  if (phase === 'failed') return 'opacity-40';
  if (phase === 'waiting' || phase === 'skipped') return 'opacity-50';
  return '';
}

/* 生成行内部 HTML（不含外层 div） */
function _rowInnerHtml(item) {
  var phase = _getPhase(item);
  return '<div class="flex items-center gap-3">' +
    '<span class="text-sm font-medium text-slate-700 whitespace-nowrap">' + item.name + '</span>' +
    '<span class="text-xs text-slate-400 whitespace-nowrap">' + item.desc + '</span>' +
    '</div>' +
    '<div class="whitespace-nowrap">' + _statusHtml(item, phase) + '</div>';
}

/* 计算排序后的索引顺序 */
function _getSortedOrder() {
  var indices = [];
  for (var i = 0; i < proxyResults.length; i++) indices.push(i);

  /* 判断是否已进入速度测试阶段 */
  var inSpeedPhase = proxyResults.some(function(r) { return r._sd || r._ts; });

  indices.sort(function(a, b) {
    var ra = proxyResults[a], rb = proxyResults[b];
    if (inSpeedPhase) {
      /* ---- 速度阶段：速度快的排上面 ---- */
      /* 分层：有速度结果(3) > 仅延迟成功待测(2) > 延迟失败/跳过(1) > 未完成(0) */
      var aRank = ra.speedSuccess ? 3 : (ra._ld && ra.latencySuccess && !ra._skip) ? 2 : (ra._ld ? 1 : 0);
      var bRank = rb.speedSuccess ? 3 : (rb._ld && rb.latencySuccess && !rb._skip) ? 2 : (rb._ld ? 1 : 0);
      if (aRank !== bRank) return bRank - aRank;
      /* 同层内排序 */
      if (aRank === 3 && bRank === 3) return rb.speed - ra.speed; /* 速度降序 */
      if (aRank === 2 && bRank === 2) return ra.latency - rb.latency; /* 延迟升序 */
      return 0;
    } else {
      /* ---- 延迟阶段：延迟低的排上面 ---- */
      var aRank = (ra._ld && ra.latencySuccess) ? 2 : (ra._ld ? 1 : 0);
      var bRank = (rb._ld && rb.latencySuccess) ? 2 : (rb._ld ? 1 : 0);
      if (aRank !== bRank) return bRank - aRank;
      if (aRank === 2 && bRank === 2) return ra.latency - rb.latency; /* 延迟升序 */
      return 0;
    }
  });
  return indices;
}

/* 初始化列表：创建所有行 DOM 元素（仅调用一次） */
function initLiveList() {
  var c = document.getElementById('live-list');
  c.classList.remove('hidden');
  c.innerHTML = '';
  _rowMap = {};
  for (var i = 0; i < proxyResults.length; i++) {
    var item = proxyResults[i];
    var row = document.createElement('div');
    row.setAttribute('data-idx', i);
    var phase = _getPhase(item);
    row.className = 'live-row flex items-center justify-between px-4 py-2.5 rounded-xl bg-white border border-slate-100 ' + _rowOpacityClass(phase);
    /* 首次入场动画：微小的错开淡入 */
    row.style.animation = 'fadeInUp .35s cubic-bezier(.16,1,.3,1) both';
    row.style.animationDelay = (i * 30) + 'ms';
    row.innerHTML = _rowInnerHtml(item);
    c.appendChild(row);
    _rowMap[i] = row;
  }
  _listReady = true;
}

/* 更新列表：增量更新内容 + FLIP 排序动画 */
function updateLiveList() {
  if (!_listReady) { initLiveList(); return; }
  var c = document.getElementById('live-list');

  /* 0. 清除上一次未完成的 FLIP 动画状态 */
  clearTimeout(_flipCleanup);
  for (var i = 0; i < proxyResults.length; i++) {
    _rowMap[i].style.transition = 'none';
    _rowMap[i].style.transform = '';
  }
  /* 强制回流，让上面的清除立即生效 */
  c.offsetHeight;

  /* 1. 增量更新每行的内容和样式（不重建 DOM） */
  for (var i = 0; i < proxyResults.length; i++) {
    var row = _rowMap[i];
    var item = proxyResults[i];
    var phase = _getPhase(item);
    row.className = 'live-row flex items-center justify-between px-4 py-2.5 rounded-xl bg-white border border-slate-100 ' + _rowOpacityClass(phase);
    /* 清除首次入场动画，避免重复 */
    row.style.animation = '';
    row.style.animationDelay = '';
    row.innerHTML = _rowInnerHtml(item);
  }

  /* 2. FLIP —— First：记录每行当前位置 */
  var firstRects = {};
  for (var i = 0; i < proxyResults.length; i++) {
    firstRects[i] = _rowMap[i].getBoundingClientRect();
  }

  /* 3. 按排序结果重新排列 DOM 顺序 */
  var sorted = _getSortedOrder();
  for (var i = 0; i < sorted.length; i++) {
    c.appendChild(_rowMap[sorted[i]]); /* appendChild 对已有元素是移动操作 */
  }

  /* 4. FLIP —— Invert：计算位移，反向偏移 */
  var moved = false;
  for (var i = 0; i < proxyResults.length; i++) {
    var first = firstRects[i];
    var last = _rowMap[i].getBoundingClientRect();
    var deltaY = first.top - last.top;
    if (Math.abs(deltaY) > 0.5) {
      moved = true;
      _rowMap[i].style.transform = 'translateY(' + deltaY + 'px)';
    }
  }

  /* 5. FLIP —— Play：触发过渡动画 */
  if (moved) {
    c.offsetHeight; /* 强制回流，确保 Invert 状态已渲染 */
    for (var i = 0; i < proxyResults.length; i++) {
      if (_rowMap[i].style.transform) {
        _rowMap[i].style.transition = 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)';
        _rowMap[i].style.transform = 'translateY(0)';
      }
    }
    /* 动画结束后清理内联样式 */
    _flipCleanup = setTimeout(function() {
      for (var i = 0; i < proxyResults.length; i++) {
        if (_rowMap[i]) {
          _rowMap[i].style.transition = '';
          _rowMap[i].style.transform = '';
        }
      }
    }, 500);
  }
}

  h+='<a href="'+RELEASE.htmlUrl+'" target="_blank" rel="noopener" class="btn-outline inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium whitespace-nowrap"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>在 GitHub 中查看</a>';

function mi(l,v){return '<div class="meta-card px-3 py-2.5 rounded-xl border border-slate-100"><div class="text-xs text-slate-400 mb-0.5 whitespace-nowrap">'+l+'</div><div class="text-sm font-medium text-slate-700 truncate">'+v+'</div></div>';}

/* ============================================================
 * 优化版测速主流程
 * ============================================================ */
async function runAllTests(){
  if(isTesting) return;
  isTesting=true;
  initTopStatus();
  document.getElementById('best-card').classList.add('hidden');
  document.getElementById('best-card').innerHTML='';
  document.getElementById('backup-section').classList.add('hidden');
  document.getElementById('backup-section').innerHTML='';
  document.getElementById('no-routes').classList.add('hidden');
  document.getElementById('retest-area').classList.add('hidden');
  document.getElementById('error-card').classList.add('hidden');
  document.getElementById('testing-status').classList.remove('hidden');
  document.getElementById('live-list').innerHTML='';
  document.getElementById('live-list').classList.remove('hidden');
  document.getElementById('progress-bar').style.width='0%';
  document.getElementById('progress-bar').className='h-full rounded-full shimmer-bar transition-all duration-500 ease-out';
  document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-indigo-500 pulse-dot';
  document.getElementById('elapsed-area').classList.remove('hidden');
  proxyResults=[];

  /* 重置列表状态 */
  _listReady = false;
  _rowMap = {};
  clearTimeout(_flipCleanup);

  startTimer();
  releaseFetched=false;

  // 必须先获取 Release 信息，确定测速目标 URL
  try {
    await fetchRelease();
  } catch (e) {
    // 获取失败，fetchRelease 内部已处理 UI 提示，这里直接终止
    stopTimer();
    isTesting = false;
    return;
  }

  /* ---- 第1步：延迟测试 —— 并行 ---- */
  _phase='latency';
  setStatus('正在并行测试代理延迟...');
  for(var i=0;i<GITHUB_PROXIES.length;i++){
    var proxy=GITHUB_PROXIES[i];
    proxyResults.push({
      name:proxy.name,
      url:proxy.url,
      desc:proxy.desc,
      latency:0,
      latencySuccess:false,
      latencyError:'',
      speed:0,
      speedTested:false,
      speedSuccess:false,
      speedError:'',
      speedNote:'',
      _tl:true,
      _ts:false,
      _ld:false,
      _sd:false,
      _skip:false
    });
  }
  updateLiveList();
  showProgress('延迟测试', 0, GITHUB_PROXIES.length);

  var latencyPromises = proxyResults.map(function(item, idx) {
    var testUrl = item.url + GITHUB_RELEASE_URL + '?_t=' + Date.now() + '_' + idx;
    return measureLatency(testUrl, LATENCY_TIMEOUT).then(function(result) {
      item.latency = result.latency;
      item.latencySuccess = result.success;
      item.latencyError = result.error || '';
      item._tl = false;
      item._ld = true;
      if (item.latencySuccess && item.latency >= LATENCY_CUTOFF) {
        item._skip = true;
        item.speedTested = true;
        item.speedSuccess = false;
        item.speedError = '延迟过高已跳过';
        item._sd = true;
      }
      updateLiveList();
      showProgress('延迟测试', proxyResults.filter(function(r){return r._ld;}).length, GITHUB_PROXIES.length);
      return item;
    });
  });

  await Promise.allSettled(latencyPromises);
  ensureSeg(0);

  /* ---- 第2步：速度测试 —— 并行 ---- */
  addSeg('正在获取最快线路...','text-slate-400');
  _phase='speed';
  var avail = proxyResults.filter(function(r){return r.latencySuccess && !r._skip;});
  if(avail.length === 0){
    var totalTime = stopTimer();
    document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-red-500';
    document.getElementById('progress-bar').className='h-full rounded-full bg-red-400 transition-all duration-500 ease-out';
    document.getElementById('progress-bar').style.width='100%';
    setStatus('测速完成（无可用线路）');
    ensureSeg(1);
    await addSegAndType('解析成功 ! !','text-red-400');
    await addSegAndType('本次耗时 '+totalTime+'s','text-slate-400');
    renderFinal(totalTime);
    isTesting=false;
    return;
  }

  setStatus('正在并行测试下载速度（'+avail.length+'条线路）...');
  showProgress('速度估算', 0, avail.length);

  var speedPromises = avail.map(function(item) {
    item._ts = true;
    updateLiveList();
    return measureSpeedByMultiplePings(item.url).then(function(sr) {
      item.speedTested = true;
      item.speedSuccess = sr.success;
      item.speed = sr.speed;
      item.speedError = sr.error || '';
      item.speedNote = sr.note || '';
      item._ts = false;
      item._sd = true;
      updateLiveList();
      showProgress('速度估算', avail.filter(function(r){return r._sd;}).length, avail.length);
      return item;
    });
  });

  await Promise.allSettled(speedPromises);
  var totalTime = stopTimer();
  document.getElementById('status-dot').className='w-2 h-2 rounded-full bg-emerald-500';
  document.getElementById('progress-bar').className='h-full rounded-full bg-emerald-500 transition-all duration-500 ease-out';
  document.getElementById('progress-bar').style.width='100%';
  setStatus('测速完成');
  ensureSeg(1);
  var goodOnes = proxyResults.filter(function(r){return r.latencySuccess && r.speedSuccess;});
  await addSegAndType('解析成功 ! !', goodOnes.length>0?'text-emerald-500':'text-red-400');
  await addSegAndType('本次耗时 '+totalTime+'s','text-slate-400');
  await addSegAndType('如下载缓慢，请切换下方其他线路','text-indigo-400');
  await new Promise(function(r){setTimeout(r,300);});
  renderFinal(totalTime);
  isTesting=false;
}

/* ===== 页面初始化 ===== */
window.addEventListener('DOMContentLoaded', function(){
  // 1. 解析 URL 参数
  var urlParam = getQueryParam('url');
  var repoInfo = parseGitHubRepoUrl(urlParam);

  // 2. 验证参数
  if (!repoInfo) {
    // 参数无效，显示错误提示
    var errorCard = document.getElementById('error-card');
    document.getElementById('error-title').textContent = '参数错误';
    document.getElementById('error-desc').textContent = '请提供有效的 GitHub 仓库链接作为 url 参数';
    errorCard.classList.remove('hidden');
    // 隐藏测速状态等区域
    document.getElementById('testing-status').classList.add('hidden');
    return; // 终止初始化，不启动测速
  }

  // 3. 参数有效，设置全局仓库信息
  currentRepoInfo = repoInfo;
  GITHUB_REPO_URL = 'https://github.com/' + repoInfo.fullName;

  // 4. 启动测速
  setTimeout(runAllTests, 300);
});
</script>
