<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔Ⅱ手机版 - STS2娘化MOD站</title>
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="img-src * data:;">
<style>
:root {
  --bg: #faf7f4;
  --strawberry-milk: #e89b9b;
  --strawberry-light: #f5c4c4;
  --mint-jelly: #a8d8c8;
  --mint-light: #c8ece0;
  --cream-yellow: #fbe8c3;
  --cream-light: #fdf3dc;
  --lavender: #c8b8d8;
  --lavender-light: #dfd4ea;
  --border-dark: #4a4458;
  --text-primary: #3d3648;
  --text-secondary: #6b6378;
  --text-muted: #9a92a5;
  --shadow-soft: 0 4px 20px rgba(74, 68, 88, 0.08);
  --shadow-medium: 0 8px 32px rgba(74, 68, 88, 0.13);
  --shadow-deep: 0 14px 44px rgba(74, 68, 88, 0.18);
  --radius-xl: 28px;
  --border-width: 2.5px;
  --font-title: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 20%, rgba(232, 155, 155, 0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 78% 65%, rgba(168, 216, 200, 0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 40% 80%, rgba(200, 184, 216, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 60% 30%, rgba(251, 232, 195, 0.06) 0%, transparent 45%);
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.page-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}
.page-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: var(--shadow-soft);
  white-space: nowrap;
  flex-shrink: 0;
}
.back-btn:hover {
  background: var(--strawberry-light);
  color: #fff;
  border-color: #c97a7a;
  transform: translateY(-2px);
  box-shadow: var(--shadow-deep);
}
.page-title {
  font-family: var(--font-title);
  font-size: 1.4rem;
  font-weight: 700;
  white-space: nowrap;
}
.search-wrapper {
  margin-bottom: 28px;
  position: relative;
  z-index: 50;
}
.search-input {
  width: 100%;
  padding: 14px 48px 14px 22px;
  font-size: 0.95rem;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 50px;
  background: #fffdfb;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s;
  box-shadow: var(--shadow-soft);
  font-family: var(--font-body);
}
.search-input:focus {
  box-shadow: var(--shadow-deep);
  border-color: var(--strawberry-milk);
}
.search-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  pointer-events: none;
}
.search-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 8px;
  right: 8px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 22px;
  box-shadow: var(--shadow-medium);
  z-index: 200;
  max-height: 260px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: all 0.25s;
  list-style: none;
  padding: 6px 0;
}
.search-dropdown.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.search-dropdown-item {
  padding: 11px 20px;
  cursor: pointer;
  font-size: 0.93rem;
  color: var(--text-primary);
}
.search-dropdown-item:hover {
  background: #fef0f0;
  color: #c97a7a;
}
.search-dropdown-item mark {
  background: var(--cream-light);
  color: #c97a7a;
  border-radius: 3px;
  padding: 0 2px;
}
.latest-section {
  margin-bottom: 36px;
}
.latest-card {
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: var(--radius-xl);
  padding: 26px 24px;
  box-shadow: var(--shadow-soft);
  transition: all 0.35s var(--transition-bounce);
  position: relative;
  overflow: hidden;
}
.latest-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-deep);
}
.latest-card-inner {
  display: flex;
  align-items: flex-start;
  gap: 18px;
}
.latest-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  object-fit: contain;
  flex-shrink: 0;
  background: #f8f5f2;
  border: 2px solid #e2dbd0;
}
.latest-info {
  flex: 1;
  min-width: 0;
}
.latest-label {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--strawberry-light);
  color: #c97a7a;
  border-radius: 12px;
  padding: 3px 12px;
  margin-bottom: 6px;
}
.latest-version {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.latest-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.latest-meta-size {
  font-weight: 600;
  color: var(--text-primary);
}
.latest-meta-tip {
  font-size: 0.78rem;
  color: var(--text-muted);
  font-weight: 400;
}
.latest-desc {
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: all 0.3s ease;
}
.latest-desc.expanded {
  -webkit-line-clamp: unset;
  display: block;
}
.desc-toggle {
  color: var(--strawberry-milk);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.85rem;
  margin-top: 2px;
  display: inline-block;
  transition: color 0.2s;
}
.desc-toggle:hover {
  color: #c97a7a;
  text-decoration: underline;
}
.latest-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.btn-download {
  display: inline-flex;
  align-items: center;
  padding: 10px 24px;
  background: var(--strawberry-milk);
  color: #fff;
  border: var(--border-width) solid #c97a7a;
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-download:hover {
  background: #fff;
  color: var(--strawberry-milk);
  transform: scale(1.05);
}
.btn-tutorial {
  display: inline-flex;
  align-items: center;
  padding: 10px 22px;
  background: #fffdfb;
  color: var(--text-primary);
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-tutorial:hover {
  background: var(--cream-light);
  border-color: #d4c490;
  transform: scale(1.05);
}
.history-section {
  margin-bottom: 24px;
}
.history-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.history-title {
  font-size: 1.15rem;
  font-weight: 700;
  white-space: nowrap;
}
.history-tabs {
  display: flex;
  background: #ede9e3;
  border-radius: 20px;
  padding: 3px;
  gap: 0;
  flex-shrink: 0;
}
.history-tab {
  padding: 6px 18px;
  border-radius: 17px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.25s var(--transition-bounce);
  border: none;
  background: transparent;
  font-family: var(--font-body);
  white-space: nowrap;
}
.history-tab.active {
  background: var(--strawberry-milk);
  color: #fff;
  box-shadow: 0 2px 8px rgba(232, 155, 155, 0.3);
}
.history-tab:hover:not(.active) {
  background: rgba(255, 255, 255, 0.5);
  color: var(--text-primary);
}
.version-card {
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 22px;
  padding: 18px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s var(--transition-bounce);
}
.version-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-medium);
}
.version-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}
.version-card-version {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
}
.version-card-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 12px;
  border-radius: 14px;
  background: var(--mint-light);
  color: #4a8a6a;
  border: 1.5px solid #8cc8a0;
  white-space: nowrap;
}
.version-card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.83rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.version-card-size {
  font-weight: 600;
  color: var(--text-primary);
}
.version-card-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 1;
  -webkit-box-orient: vertical;
  overflow: hidden;
  transition: all 0.3s ease;
}
.version-card-desc.expanded {
  -webkit-line-clamp: unset;
  display: block;
}
.version-card-toggle {
  color: var(--strawberry-milk);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.82rem;
  margin-top: 2px;
  display: inline-block;
  transition: color 0.2s;
}
.version-card-toggle:hover {
  color: #c97a7a;
  text-decoration: underline;
}
.version-card-actions {
  margin-top: 12px;
}
.btn-small-download {
  display: inline-flex;
  align-items: center;
  padding: 8px 20px;
  background: var(--strawberry-milk);
  color: #fff;
  border: var(--border-width) solid #c97a7a;
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-small-download:hover {
  background: #fff;
  color: var(--strawberry-milk);
  transform: scale(1.05);
}
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 0.95rem;
}
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 30px 0 10px;
  flex-wrap: nowrap;
  overflow: hidden;
}
.pagination-btn, .pagination-page {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding: 0 12px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.pagination-btn:hover:not(:disabled), .pagination-page:hover:not(.active) {
  background: var(--strawberry-light);
  color: #fff;
  border-color: #c97a7a;
  transform: scale(1.07);
}
.pagination-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}
.pagination-page.active {
  background: var(--strawberry-milk);
  color: #fff;
  border-color: #c97a7a;
  box-shadow: 0 2px 12px rgba(232, 155, 155, 0.3);
}
.pagination-dots {
  color: var(--text-muted);
  font-weight: 600;
  padding: 0 4px;
  user-select: none;
}
.pagination-goto {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 10px;
  flex-shrink: 0;
}
.pagination-goto-input {
  width: 52px;
  height: 40px;
  padding: 0 10px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  outline: none;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s var(--transition-bounce);
  -moz-appearance: textfield;
}
.pagination-goto-input::-webkit-outer-spin-button,
.pagination-goto-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.pagination-goto-input:focus {
  border-color: var(--strawberry-milk);
  box-shadow: var(--shadow-deep);
}
.pagination-goto-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding: 0 14px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.pagination-goto-btn:hover {
  background: var(--strawberry-light);
  color: #fff;
  border-color: #c97a7a;
  transform: scale(1.07);
}
.pagination-goto-mobile-trigger {
  display: none;
}
.footer {
  text-align: center;
  padding: 30px 4px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: #fffefb;
  border: 1.5px solid #d5cdc0;
  border-radius: 24px;
  padding: 10px 22px;
  font-weight: 550;
  font-size: 0.88rem;
  color: var(--text-primary);
  box-shadow: var(--shadow-deep);
  transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
  z-index: 600;
  white-space: nowrap;
  letter-spacing: 0.02em;
  pointer-events: none;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
}
@media (max-width: 600px) {
  .page-container {
    padding: 18px 14px 50px;
  }
  .page-header {
    gap: 10px;
  }
  .page-title {
    font-size: 1.2rem;
  }
  .latest-card {
    padding: 20px 18px;
  }
  .latest-card-inner {
    gap: 14px;
  }
  .latest-icon {
    width: 52px;
    height: 52px;
    border-radius: 13px;
  }
  .latest-version {
    font-size: 1.05rem;
  }
  .latest-actions {
    gap: 8px;
  }
  .btn-download, .btn-tutorial {
    padding: 9px 18px;
    font-size: 0.85rem;
  }
  .history-tab {
    padding: 5px 14px;
    font-size: 0.78rem;
  }
  .version-card {
    padding: 16px 16px;
  }
  .pagination-btn, .pagination-page {
    min-width: 36px;
    height: 36px;
    font-size: 0.85rem;
  }
  .pagination-goto-input, .pagination-goto-btn {
    display: none;
  }
  .pagination-goto-mobile-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 36px;
    height: 36px;
    padding: 0 10px;
    background: #fffdfb;
    border: var(--border-width) solid var(--border-dark);
    border-radius: 30px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: all 0.3s var(--transition-bounce);
    user-select: none;
  }
  .pagination-goto-mobile-trigger:hover {
    background: var(--strawberry-light);
    color: #fff;
    border-color: #c97a7a;
  }
  .pagination-goto {
    margin-left: 6px;
  }
}
.goto-popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.25);
  z-index: 700;
  align-items: flex-end;
  justify-content: center;
}
.goto-popup-overlay.active {
  display: flex;
}
.goto-popup {
  width: 100%;
  max-width: 360px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 32px;
  box-shadow: var(--shadow-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: popupSlideUp 0.3s var(--transition-bounce);
}
@keyframes popupSlideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.goto-popup-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
}
.goto-popup-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.goto-popup-input {
  width: 80px;
  height: 44px;
  padding: 0 14px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  outline: none;
  -moz-appearance: textfield;
}
.goto-popup-input::-webkit-outer-spin-button,
.goto-popup-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.goto-popup-input:focus {
  border-color: var(--strawberry-milk);
}
.goto-popup-confirm {
  height: 44px;
  padding: 0 24px;
  background: var(--strawberry-milk);
  color: #fff;
  border: var(--border-width) solid #c97a7a;
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
}
.goto-popup-confirm:hover {
  background: #fff;
  color: var(--strawberry-milk);
  transform: scale(1.05);
}
@media (min-width: 601px) {
  .goto-popup-overlay {
    display: none !important;
  }
}
</style>
</head>
<body>

<div class="page-container">
  <header class="page-header">
    <a href="../../index.html" class="back-btn">&larr; 返回</a>
    <h1 class="page-title">塔Ⅱ手机版</h1>
  </header>

  <div class="search-wrapper" id="searchWrapper">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索版本号..." autocomplete="off">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="#9a92a5" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
    <ul class="search-dropdown" id="searchDropdown"></ul>
  </div>

    </div>
    <div id="historyList"></div>

</div>

<script>
(function() {
  var LAUNCHER_ICON = 'http://shp.qpic.cn/collector/1976464052/97d2e4e6-a0ac-4104-99ec-13b66af8a785/0';
  var GAME_ICON = 'http://shp.qpic.cn/collector/1976464052/e2e5de8f-a1cd-40e2-aef5-e6acc9327b3b/0';

  var launcherData = [
    {
      version: '0.1.0',
      date: '2026-06-05',
      size: '66.62MB',
      description: '杀戮尖塔2的最新版启动器，需要配合游戏本体使用，目前推荐版本v0.103.2兼容性较强',
      downloadUrl: 'https://files.zohopublic.com.cn/public/workdrive-public/download/05fgz7f808c35d3e44f1db95b4e62d85494d0?x-cli-msg=%7B%22isFileOwner%22%3Afalse%2C%22version%22%3A%221.0%22%2C%22isWDSupport%22%3Afalse%7D'
    }
  ];

  var gameData = [
    {
      version: 'v0.103.2',
      date: '2026-06-05',
      size: '289.44MB',
      description: '猫猫暂时还没有想好介绍哦...不过推荐使用这个版本，稳定性较强ദ്ദി˶ᵒ ᵕ ˂)',
      downloadUrl: 'https://files.zohopublic.com.cn/public/workdrive-public/download/05fgz6b56a9c2329149028afac59056d22849?x-cli-msg=%7B%22isFileOwner%22%3Afalse%2C%22version%22%3A%221.0%22%2C%22isWDSupport%22%3Afalse%7D'
    },
    {
      version: 'v0.103.3',
      date: '2026-06-05',
      size: '829.44MB',
      description: '猫猫暂时还没有想好介绍哦...',
      downloadUrl: 'https://files.zohopublic.com.cn/public/workdrive-public/download/05fgz6ff2c90c0b7248249d818620ae68b451?x-cli-msg=%7B%22isFileOwner%22%3Afalse%2C%22version%22%3A%221.0%22%2C%22isWDSupport%22%3Afalse%7D'
    },
    {
      version: 'v0.106.1',
      date: '2026-06-05',
      size: '862.12MB',
      description: '猫猫暂时还没有想好介绍哦...',
      downloadUrl: 'https://files.zohopublic.com.cn/public/workdrive-public/download/05fgza86aaebac7d941cf8067bb86a0fd48be?x-cli-msg=%7B%22isFileOwner%22%3Afalse%2C%22version%22%3A%221.0%22%2C%22isWDSupport%22%3Afalse%7D'
    },
    {
      version: 'v0.107.0',
      date: '2026-06-05',
      size: '865.39MB',
      description: '猫猫暂时还没有想好介绍哦...',
      downloadUrl: 'https://files.zohopublic.com.cn/public/workdrive-public/download/05fgz43be7b3709f540b5be6ba344a6212b33?x-cli-msg=%7B%22isFileOwner%22%3Afalse%2C%22version%22%3A%221.0%22%2C%22isWDSupport%22%3Afalse%7D'
    }
  ];

  var currentTab = 'launcher';
  var currentPage = 1;
  var ITEMS_PER_PAGE = 5;
  var searchQuery = '';
  var toastTimer;

  function showToast(message) {
    clearTimeout(toastTimer);
    var t = document.getElementById('toast');
    t.textContent = message;
    t.classList.add('show');
    toastTimer = setTimeout(function() {
      t.classList.remove('show');
    }, 2200);
  }

  function renderLatest() {
    var section = document.getElementById('latestSection');
    var latest = launcherData[0];
    var descId = 'latest-desc';
    var toggleId = 'latest-toggle';
    section.innerHTML =
      '<div class="latest-card">' +
        '<div class="latest-card-inner">' +
          '<img src="' + LAUNCHER_ICON + '" alt="启动器" class="latest-icon">' +
          '<div class="latest-info">' +
            '<span class="latest-label">最新版</span>' +
            '<div class="latest-version">启动器 ' + latest.version + '</div>' +
            '<div class="latest-meta">' +
              '<span class="latest-meta-size">' + latest.size + '</span>' +
              '<span class="latest-meta-tip">＊需配合游戏本体一起使用</span>' +
              '<span>' + latest.date + '</span>' +
            '</div>' +
            '<div class="latest-desc" id="' + descId + '">' + latest.description + '</div>' +
            '<span class="desc-toggle" id="' + toggleId + '" style="display:none;">展开</span>' +
            '<div class="latest-actions">' +
              '<a href="' + latest.downloadUrl + '" target="_blank" rel="noopener noreferrer" class="btn-download">下载启动器</a>' +
              '<a href="https://m.bilibili.com/video/BV1chojBxEcG" target="_blank" rel="noopener noreferrer" class="btn-tutorial">使用教程</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var descEl = document.getElementById(descId);
    var toggleEl = document.getElementById(toggleId);
    if (descEl && toggleEl) {
      setTimeout(function() {
        if (descEl.scrollHeight > descEl.clientHeight + 2) {
          toggleEl.style.display = 'inline-block';
        }
      }, 30);
      toggleEl.addEventListener('click', function() {
        var expanded = descEl.classList.toggle('expanded');
        toggleEl.textContent = expanded ? '收起' : '展开';
      });
    }
  }

  function getCurrentData() {
    var data = currentTab === 'launcher' ? launcherData : gameData;
    if (!searchQuery) return data.slice();
    var q = searchQuery.toLowerCase();
    return data.filter(function(item) {
      return item.version.toLowerCase().indexOf(q) !== -1 || item.description.toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderHistory() {
    var list = document.getElementById('historyList');
    var data = getCurrentData();
    var totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);
    if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
    var start = (currentPage - 1) * ITEMS_PER_PAGE;
    var pageData = data.slice(start, start + ITEMS_PER_PAGE);

    if (pageData.length === 0) {
      list.innerHTML = '<div class="empty-state">没有找到匹配的版本</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    var html = '';
    pageData.forEach(function(item, idx) {
      var descId = 'hist-desc-' + currentTab + '-' + (start + idx);
      var toggleId = 'hist-toggle-' + currentTab + '-' + (start + idx);
      var isFirst = (currentTab === 'launcher' && start + idx === 0) || (currentTab === 'game' && start + idx === 0);
      html +=
        '<div class="version-card">' +
          '<div class="version-card-header">' +
            '<span class="version-card-version">' + item.version + '</span>' +
            (isFirst ? '<span class="version-card-badge">推荐</span>' : '') +
          '</div>' +
          '<div class="version-card-meta">' +
            '<span>' + item.date + '</span>' +
            '<span class="version-card-size">' + item.size + '</span>' +
          '</div>' +
          '<div class="version-card-desc" id="' + descId + '">' + item.description + '</div>' +
          '<span class="version-card-toggle" id="' + toggleId + '" style="display:none;">展开</span>' +
          '<div class="version-card-actions">' +
            '<a href="' + item.downloadUrl + '" target="_blank" rel="noopener noreferrer" class="btn-small-download">下载</a>' +
          '</div>' +
        '</div>';
    });
    list.innerHTML = html;

    pageData.forEach(function(item, idx) {
      var descId = 'hist-desc-' + currentTab + '-' + (start + idx);
      var toggleId = 'hist-toggle-' + currentTab + '-' + (start + idx);
      var descEl = document.getElementById(descId);
      var toggleEl = document.getElementById(toggleId);
      if (descEl && toggleEl) {
        (function(de, te) {
          setTimeout(function() {
            if (de.scrollHeight > de.clientHeight + 2) {
              te.style.display = 'inline-block';
            }
          }, 30);
          te.addEventListener('click', function() {
            var expanded = de.classList.toggle('expanded');
            te.textContent = expanded ? '收起' : '展开';
          });
        })(descEl, toggleEl);
      }
    });

    renderPagination(data.length, currentPage);
  }

  function renderPagination(totalItems, currentPageNum) {
    var paginationEl = document.getElementById('pagination');
    paginationEl.innerHTML = '';
    var totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    if (totalPages <= 1) return;

    function createBtn(cls, content, disabled, handler) {
      var btn = document.createElement('button');
      btn.className = cls;
      btn.innerHTML = content;
      if (disabled) btn.disabled = true;
      if (handler) btn.addEventListener('click', handler);
      return btn;
    }

    function createPageBtn(pageNum) {
      return createBtn('pagination-page' + (pageNum === currentPageNum ? ' active' : ''), pageNum, false, function() {
        currentPage = pageNum;
        renderHistory();
        document.getElementById('historyList').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function createDots() {
      var span = document.createElement('span');
      span.className = 'pagination-dots';
      span.textContent = '...';
      return span;
    }

    paginationEl.appendChild(createBtn('pagination-btn', '&#8249;', currentPageNum <= 1, function() {
      if (currentPageNum > 1) {
        currentPage--;
        renderHistory();
        document.getElementById('historyList').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }));

    paginationEl.appendChild(createPageBtn(1));

    if (totalPages <= 4) {
      for (var i = 2; i <= totalPages; i++) {
        paginationEl.appendChild(createPageBtn(i));
      }
    } else {
      if (currentPageNum <= 4) {
        for (var j = 2; j <= 4; j++) paginationEl.appendChild(createPageBtn(j));
        paginationEl.appendChild(createDots());
        paginationEl.appendChild(createPageBtn(totalPages));
      } else {
        paginationEl.appendChild(createDots());
        if (currentPageNum - 1 > 1) paginationEl.appendChild(createPageBtn(currentPageNum - 1));
        paginationEl.appendChild(createPageBtn(currentPageNum));
        if (currentPageNum + 1 < totalPages) paginationEl.appendChild(createPageBtn(currentPageNum + 1));
        paginationEl.appendChild(createDots());
        paginationEl.appendChild(createPageBtn(totalPages));
      }
    }

    paginationEl.appendChild(createBtn('pagination-btn', '&#8250;', currentPageNum >= totalPages, function() {
      if (currentPageNum < totalPages) {
        currentPage++;
        renderHistory();
        document.getElementById('historyList').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }));

    var gotoWrap = document.createElement('span');
    gotoWrap.className = 'pagination-goto';

    var gotoInput = document.createElement('input');
    gotoInput.type = 'text';
    gotoInput.className = 'pagination-goto-input';
    gotoInput.placeholder = '\\';
    gotoInput.maxLength = 3;
    gotoInput.setAttribute('aria-label', '输入页码');

    var gotoBtn = document.createElement('button');
    gotoBtn.className = 'pagination-goto-btn';
    gotoBtn.innerHTML = '<svg style="width:18px;height:18px;vertical-align:middle;" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
    gotoBtn.setAttribute('aria-label', '跳转到指定页');

    var gotoMobile = document.createElement('button');
    gotoMobile.className = 'pagination-goto-mobile-trigger';
    gotoMobile.innerHTML = '<svg style="width:14px;height:14px;" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
    gotoMobile.setAttribute('aria-label', '跳转页码');

    function doGoto(value) {
      var num = parseInt(value, 10);
      if (isNaN(num) || num < 1 || num > totalPages) {
        showToast('页码范围：1 ~ ' + totalPages);
        return;
      }
      currentPage = num;
      renderHistory();
      gotoInput.value = '';
      document.getElementById('historyList').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    gotoInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^\d]/g, '').slice(0, 3);
    });
    gotoInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doGoto(this.value);
    });
    gotoBtn.addEventListener('click', function() {
      doGoto(gotoInput.value);
    });
    gotoMobile.addEventListener('click', function() {
      openGotoPopup(totalPages);
    });

    gotoWrap.appendChild(gotoInput);
    gotoWrap.appendChild(gotoBtn);
    gotoWrap.appendChild(gotoMobile);
    paginationEl.appendChild(gotoWrap);
  }

  function openGotoPopup(totalPages) {
    var existing = document.getElementById('gotoPopupOverlay');
    if (existing) existing.remove();
    var overlay = document.createElement('div');
    overlay.className = 'goto-popup-overlay active';
    overlay.id = 'gotoPopupOverlay';
    var popup = document.createElement('div');
    popup.className = 'goto-popup';
    var title = document.createElement('div');
    title.className = 'goto-popup-title';
    title.textContent = '跳转到第几页？(共 ' + totalPages + ' 页)';
    var row = document.createElement('div');
    row.className = 'goto-popup-row';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'goto-popup-input';
    input.placeholder = '页码';
    input.maxLength = 3;
    input.inputMode = 'numeric';
    input.addEventListener('input', function() {
      this.value = this.value.replace(/[^\d]/g, '').slice(0, 3);
    });
    var confirmBtn = document.createElement('button');
    confirmBtn.className = 'goto-popup-confirm';
    confirmBtn.textContent = '跳转';
    function doMobileGoto() {
      var num = parseInt(input.value, 10);
      if (isNaN(num) || num < 1 || num > totalPages) {
        showToast('页码范围：1 ~ ' + totalPages);
        return;
      }
      currentPage = num;
      renderHistory();
      overlay.remove();
      setTimeout(function() {
        document.getElementById('historyList').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doMobileGoto();
    });
    confirmBtn.addEventListener('click', doMobileGoto);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) overlay.remove();
    });
    row.appendChild(input);
    row.appendChild(confirmBtn);
    popup.appendChild(title);
    popup.appendChild(row);
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    setTimeout(function() { input.focus(); }, 100);
  }

  function updateSearchDropdown() {
    var dropdown = document.getElementById('searchDropdown');
    var query = searchInput.value.trim();
    dropdown.innerHTML = '';
    if (!query) {
      dropdown.classList.remove('active');
      return;
    }
    var q = query.toLowerCase();
    var allData = currentTab === 'launcher' ? launcherData : gameData;
    var matches = allData.filter(function(item) {
      return item.version.toLowerCase().indexOf(q) !== -1 || item.description.toLowerCase().indexOf(q) !== -1;
    });
    if (matches.length === 0) {
      dropdown.innerHTML = '<li style="padding:16px;text-align:center;color:var(--text-muted);">没有找到相关版本</li>';
    } else {
      var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var regex = new RegExp('(' + escapedQuery + ')', 'gi');
      matches.slice(0, 8).forEach(function(item) {
        var li = document.createElement('li');
        li.className = 'search-dropdown-item';
        li.innerHTML = item.version.replace(regex, '<mark>$1</mark>') + ' <span style="color:var(--text-muted);font-size:0.8rem;margin-left:6px;">' + item.size + '</span>';
        li.addEventListener('click', function() {
          searchInput.value = item.version;
          searchQuery = item.version;
          dropdown.classList.remove('active');
          currentPage = 1;
          renderHistory();
        });
        dropdown.appendChild(li);
      });
    }
    dropdown.classList.add('active');
  }

  var searchInput = document.getElementById('searchInput');
  var searchDropdown = document.getElementById('searchDropdown');
  var searchWrapper = document.getElementById('searchWrapper');

  searchInput.addEventListener('input', function() {
    searchQuery = this.value.trim();
    currentPage = 1;
    renderHistory();
    updateSearchDropdown();
  });

  searchInput.addEventListener('focus', function() {
    if (this.value.trim().length >= 1) updateSearchDropdown();
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      searchDropdown.classList.remove('active');
      searchInput.blur();
    }
    if (e.key === 'Enter') {
      searchDropdown.classList.remove('active');
    }
  });

  document.addEventListener('click', function(e) {
    if (!searchWrapper.contains(e.target)) {
      searchDropdown.classList.remove('active');
    }
  });

  document.querySelectorAll('.history-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.history-tab').forEach(function(t) {
        t.classList.remove('active');
      });
      this.classList.add('active');
      currentTab = this.getAttribute('data-tab');
      currentPage = 1;
      searchInput.value = '';
      searchQuery = '';
      searchDropdown.classList.remove('active');
      renderHistory();
    });
  });

  renderLatest();
  renderHistory();
})();
</script>
</body>
</html>
