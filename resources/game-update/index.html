<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔Ⅱ 手机版更新中心 - STS2娘化MOD站</title>
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #faf7f4;
  --strawberry-milk: #e89b9b;
  --strawberry-light: #f5c4c4;
  --mint-jelly: #a8d8c8;
  --mint-light: #c8ece0;
  --cream-yellow: #fbe8c3;
  --cream-light: #fdf3dc;
  --lavender: #c8b8d8;
  --lavender-light: #dfd4ea;
  --border-dark: #4a4458;
  --text-primary: #3d3648;
  --text-secondary: #6b6378;
  --text-muted: #9a92a5;
  --shadow-soft: 0 4px 20px rgba(74,68,88,0.08);
  --shadow-medium: 0 8px 32px rgba(74,68,88,0.13);
  --shadow-deep: 0 14px 44px rgba(74,68,88,0.18);
  --radius-xl: 28px;
  --border-width: 2.5px;
  --font-title: 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --font-body: 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --transition-bounce: cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 20%,rgba(232,155,155,0.06) 0%,transparent 55%),
    radial-gradient(ellipse at 78% 65%,rgba(168,216,200,0.07) 0%,transparent 55%),
    radial-gradient(ellipse at 40% 80%,rgba(200,184,216,0.05) 0%,transparent 50%),
    radial-gradient(circle at 60% 30%,rgba(251,232,195,0.06) 0%,transparent 45%);
  background-attachment:fixed;
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

/* === Loading === */
.loading-overlay{
  position:fixed;inset:0;z-index:9999;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .5s ease,visibility .5s ease;opacity:1;visibility:visible;
}
.loading-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-spinner{
  width:44px;height:44px;border:4px solid #e2dbd0;border-top-color:var(--strawberry-milk);
  border-radius:50%;animation:spin .8s linear infinite;margin-bottom:18px;
}
.loading-text{
  font-family:var(--font-title);font-size:1rem;color:var(--text-secondary);
  animation:loadPulse 1.5s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes loadPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* === Main Container === */
.main-container{
  max-width:780px;margin:0 auto;padding:24px 20px 60px;
  opacity:0;transition:opacity .5s ease;
}

/* === Header === */
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:32px;flex-wrap:wrap;gap:12px;
}
.back-link{
  display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
  text-decoration:none;color:var(--text-secondary);font-size:.88rem;font-weight:600;
  border:var(--border-width) solid var(--border-dark);border-radius:30px;
  background:#fffdfb;box-shadow:var(--shadow-soft);
  transition:all .3s var(--transition-bounce);
}
.back-link:hover{
  background:var(--strawberry-light);color:#fff;border-color:#c97a7a;
  transform:translateY(-2px);
}
.back-link svg{width:16px;height:16px}
.page-title{
  font-family:var(--font-title);font-size:1.35rem;font-weight:700;
  white-space:nowrap;letter-spacing:.02em;
}

/* === Latest Section === */
.latest-section{margin-bottom:36px}
.latest-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:18px;
}
.latest-card{
  background:#fffdfb;border:var(--border-width) solid var(--border-dark);
  border-radius:var(--radius-xl);padding:24px 22px 22px;
  box-shadow:var(--shadow-soft);position:relative;overflow:hidden;
  transition:all .35s var(--transition-bounce);
}
.latest-card:hover{
  transform:translateY(-6px) scale(1.02);box-shadow:var(--shadow-deep);
}
.latest-card--launcher{background:linear-gradient(135deg,#f0faf6 0%,#e4f5ed 100%)}
.latest-card--game{background:linear-gradient(135deg,#fefbf0 0%,#fdf3dc 100%)}
.latest-card-header{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
}
.latest-card-icon{
  width:40px;height:40px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;flex-shrink:0;
}
.latest-card--launcher .latest-card-icon{background:rgba(168,216,200,.3)}
.latest-card--game .latest-card-icon{background:rgba(251,232,195,.4)}
.latest-card-icon svg{width:20px;height:20px}
.latest-card--launcher .latest-card-icon svg{color:#5ba88a}
.latest-card--game .latest-card-icon svg{color:#b8943e}
.latest-card-type{font-weight:700;font-size:.95rem;color:var(--text-primary)}
.latest-badge{
  padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;
  background:var(--strawberry-light);color:#fff;border:2px solid #c97a7a;
  margin-left:auto;flex-shrink:0;
}
.latest-version{
  font-family:var(--font-title);font-size:1.55rem;font-weight:800;
  color:var(--text-primary);margin-bottom:8px;letter-spacing:.01em;
}
.latest-meta{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;
}
.latest-meta-item{
  font-size:.82rem;color:var(--text-secondary);display:flex;align-items:center;gap:4px;
}
.latest-meta-item svg{width:14px;height:14px;color:var(--text-muted);flex-shrink:0}
.latest-compat{
  font-size:.8rem;color:var(--mint-jelly);font-weight:600;
  background:rgba(168,216,200,.15);padding:4px 12px;border-radius:20px;
  display:inline-block;margin-bottom:14px;
}
.latest-compat--warn{color:#c49a3a;background:rgba(251,232,195,.2)}
.latest-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn-download{
  display:inline-flex;align-items:center;gap:6px;padding:10px 22px;
  background:var(--strawberry-milk);color:#fff;border:var(--border-width) solid #c97a7a;
  border-radius:30px;font-weight:700;font-size:.88rem;cursor:pointer;
  text-decoration:none;white-space:nowrap;
  transition:all .3s var(--transition-bounce);font-family:var(--font-body);
}
.btn-download:hover{background:#fff;color:var(--strawberry-milk);transform:scale(1.05)}
.btn-download svg{width:16px;height:16px}
.btn-history{
  display:inline-flex;align-items:center;gap:4px;padding:8px 16px;
  background:transparent;color:var(--text-secondary);
  border:2px solid var(--border-dark);border-radius:30px;font-weight:600;
  font-size:.82rem;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:all .25s var(--transition-bounce);font-family:var(--font-body);
}
.btn-history:hover{
  background:var(--lavender-light);color:var(--text-primary);border-color:var(--lavender);
}
.btn-history svg{width:14px;height:14px}

/* === Search & Filter === */
.search-filter{margin-bottom:28px}
.search-bar{
  position:relative;margin-bottom:14px;
}
.search-input{
  width:100%;padding:14px 48px 14px 22px;font-size:.95rem;
  border:var(--border-width) solid var(--border-dark);border-radius:50px;
  background:#fffdfb;color:var(--text-primary);outline:none;
  transition:all .3s;box-shadow:var(--shadow-soft);font-family:var(--font-body);
}
.search-input:focus{box-shadow:var(--shadow-deep);border-color:var(--strawberry-milk)}
.search-input::placeholder{color:var(--text-muted)}
.search-icon{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;color:var(--text-muted);pointer-events:none;
}
.filter-tags{display:flex;gap:12px;flex-wrap:wrap}
.filter-tag{
  display:inline-flex;align-items:center;padding:9px 20px;
  background:#fffdfb;border:var(--border-width) solid var(--border-dark);
  border-radius:30px 30px 22px 22px;cursor:pointer;font-size:.85rem;
  font-weight:600;color:var(--text-primary);user-select:none;
  box-shadow:var(--shadow-soft);transition:all .3s var(--transition-bounce);
}
.filter-tag::before{
  content:'';display:inline-block;width:10px;height:10px;
  border:2px solid var(--border-dark);border-radius:50%;margin-right:8px;
  transition:background .3s;
}
.filter-tag.active{background:var(--strawberry-light);color:#fff;border-color:#c97a7a}
.filter-tag.active::before{background:#fff;border-color:#c97a7a}
.filter-tag--launcher::before{background:var(--mint-light)}
.filter-tag--game::before{background:var(--cream-yellow)}
.filter-tag--launcher.active::before,
.filter-tag--game.active::before{background:#fff;border-color:#c97a7a}

/* === Timeline === */
.timeline-section{margin-bottom:40px}
.timeline-title{
  font-size:1.3rem;font-weight:700;margin-bottom:22px;padding-left:16px;
  border-left:6px solid var(--strawberry-milk);display:inline-block;position:relative;
}
.timeline-title::after{
  content:'';position:absolute;bottom:-4px;left:0;width:40px;height:4px;
  background:var(--mint-jelly);border-radius:2px;
}
.timeline{position:relative;padding-left:32px}
.timeline::before{
  content:'';position:absolute;left:11px;top:8px;bottom:8px;width:2.5px;
  background:repeating-linear-gradient(to bottom,#d5cdc0 0,#d5cdc0 6px,transparent 6px,transparent 12px);
  border-radius:2px;
}
.timeline-item{
  position:relative;margin-bottom:20px;
  animation:fadeSlideIn .5s cubic-bezier(.16,1,.3,1) both;
}
.timeline-item:nth-child(2){animation-delay:.06s}
.timeline-item:nth-child(3){animation-delay:.12s}
.timeline-item:nth-child(4){animation-delay:.18s}
.timeline-item:nth-child(5){animation-delay:.24s}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}
.timeline-node{
  position:absolute;left:-32px;top:18px;width:22px;height:22px;
  border-radius:50%;border:3px solid var(--border-dark);z-index:2;
  display:flex;align-items:center;justify-content:center;
}
.timeline-node--launcher{background:var(--mint-light)}
.timeline-node--game{background:var(--cream-yellow)}
.timeline-node svg{width:10px;height:10px}
.timeline-node--launcher svg{color:#5ba88a}
.timeline-node--game svg{color:#b8943e}

.timeline-card{
  background:#fffdfb;border:var(--border-width) solid var(--border-dark);
  border-radius:22px;padding:18px 20px;box-shadow:var(--shadow-soft);
  transition:all .3s var(--transition-bounce);
}
.timeline-card:hover{
  transform:translateY(-3px);box-shadow:var(--shadow-medium);
}
.timeline-card-header{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;
}
.timeline-version{font-weight:800;font-size:1.05rem;color:var(--text-primary)}
.timeline-type-tag{
  padding:3px 12px;border-radius:20px;font-size:.72rem;font-weight:700;
  border:2px solid var(--border-dark);
}
.timeline-type-tag--launcher{background:var(--mint-light);color:#4a8a6e;border-color:#8cc8a0}
.timeline-type-tag--game{background:var(--cream-yellow);color:#8a7a3e;border-color:#d4c47a}
.timeline-new-badge{
  padding:2px 9px;border-radius:20px;font-size:.68rem;font-weight:700;
  background:var(--strawberry-light);color:#fff;border:2px solid #c97a7a;
}
.timeline-date{font-size:.82rem;color:var(--text-muted);margin-left:auto;white-space:nowrap}
.timeline-info{
  display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;font-size:.82rem;
  color:var(--text-secondary);
}
.timeline-info-item{display:flex;align-items:center;gap:4px}
.timeline-info-item svg{width:13px;height:13px;color:var(--text-muted);flex-shrink:0}
.timeline-compat{
  font-size:.78rem;color:var(--mint-jelly);font-weight:600;
  background:rgba(168,216,200,.12);padding:3px 10px;border-radius:20px;
  display:inline-flex;align-items:center;gap:3px;
}
.timeline-compat svg{width:12px;height:12px}
.timeline-changelog{
  color:var(--text-secondary);font-size:.88rem;line-height:1.65;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;transition:all .3s ease;margin-bottom:4px;
  white-space:pre-line;
}
.timeline-changelog.expanded{-webkit-line-clamp:unset;display:block}
.changelog-toggle{
  color:var(--strawberry-milk);font-weight:600;cursor:pointer;
  font-size:.84rem;display:inline-block;margin-bottom:8px;
  transition:color .2s;background:none;border:none;font-family:var(--font-body);
  padding:0;
}
.changelog-toggle:hover{text-decoration:underline}
.timeline-downloads{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn-dl{
  display:inline-flex;align-items:center;gap:5px;padding:8px 18px;
  background:var(--strawberry-milk);color:#fff;border:2px solid #c97a7a;
  border-radius:30px;font-weight:700;font-size:.82rem;cursor:pointer;
  text-decoration:none;white-space:nowrap;
  transition:all .3s var(--transition-bounce);font-family:var(--font-body);
}
.btn-dl:hover{background:#fff;color:var(--strawberry-milk);transform:scale(1.05)}
.btn-dl svg{width:14px;height:14px}

/* === Empty State === */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--text-muted);
  border:var(--border-width) solid var(--border-dark);border-radius:22px;
  background:#fffdfb;
}
.empty-state svg{width:40px;height:40px;color:#d5cdc0;margin-bottom:12px}
.empty-state p{font-size:.95rem}

/* === Footer === */
.footer{text-align:center;padding:30px 4px 20px;color:var(--text-muted);font-size:.88rem}
.footer a{color:var(--strawberry-milk);text-decoration:none}
.footer a:hover{text-decoration:underline}

/* === Toast === */
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);
  background:#fffefb;border:1.5px solid #d5cdc0;border-radius:24px;
  padding:10px 22px;font-weight:550;font-size:.88rem;color:var(--text-primary);
  box-shadow:var(--shadow-deep);z-index:600;white-space:nowrap;
  transition:transform .35s cubic-bezier(.34,1.4,.64,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* === Responsive === */
@media(max-width:640px){
  .latest-grid{grid-template-columns:1fr}
  .latest-version{font-size:1.3rem}
  .page-header{justify-content:center;text-align:center}
  .page-title{width:100%;text-align:center}
  .timeline{padding-left:26px}
  .timeline::before{left:8px}
  .timeline-node{left:-26px;width:18px;height:18px}
  .timeline-node svg{width:8px;height:8px}
  .timeline-date{margin-left:0;flex-basis:100%}
  .main-container{padding:18px 14px 40px}
}
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <p class="loading-text">正在加载版本信息...</p>
</div>

<div class="main-container" id="mainContent">

  <!-- Header -->
  <header class="page-header">
    <a href="../../index.html" class="back-link">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      返回MOD站
    </a>
    <h1 class="page-title">塔Ⅱ 手机版更新中心</h1>
  </header>

  <!-- Latest Versions -->
  <section class="latest-section">
    <div class="latest-grid" id="latestGrid"></div>
  </section>

  <!-- Search & Filter -->
  <section class="search-filter">
    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索版本号，如 0.103.2 ..." autocomplete="off">
      <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="m21 21-4.35-4.35"/></svg>
    </div>
    <div class="filter-tags" id="filterTags">
      <span class="filter-tag active" data-filter="all">全部</span>
      <span class="filter-tag filter-tag--launcher" data-filter="launcher">APK 启动器</span>
      <span class="filter-tag filter-tag--game" data-filter="game">游戏本体</span>
    </div>
  </section>

  <!-- Timeline -->
  <section class="timeline-section">
    <h2 class="timeline-title">历史版本</h2>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>STS2娘化MOD站 &copy; 2026 壹个屑猫猫 &nbsp;|&nbsp; <a href="../../index.html">返回首页</a></p>
  </footer>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
  var DATA_URL = '../json/game_update/game_versions.json';
  var allData = { launcher: [], game: [] };
  var combinedList = [];
  var activeFilter = 'all';
  var searchQuery = '';

  var loadingOverlay = document.getElementById('loadingOverlay');
  var mainContent = document.getElementById('mainContent');
  var latestGrid = document.getElementById('latestGrid');
  var timeline = document.getElementById('timeline');
  var searchInput = document.getElementById('searchInput');
  var filterTags = document.getElementById('filterTags');
  var toastEl = document.getElementById('toast');
  var toastTimer;

  function showToast(msg) {
    clearTimeout(toastTimer);
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); resolve(); } catch(e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  /* === SVG Icons === */
  var ICONS = {
    phone: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>',
    package: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>',
    calendar: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    hardrive: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="22" y1="12" x2="2" y2="12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>',
    link: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>',
    download: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
    info: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
    arrowDown: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>',
    empty: '<svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>'
  };

  /* === Data Loading === */
  async function loadData() {
    try {
      var controller = new AbortController();
      var tid = setTimeout(function(){ controller.abort(); }, 8000);
      var resp = await fetch(DATA_URL, { signal: controller.signal, cache: 'no-store' });
      clearTimeout(tid);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      allData.launcher = data.launcher || [];
      allData.game = data.game || [];
    } catch(e) {
      console.error('加载版本数据失败:', e);
      allData.launcher = [];
      allData.game = [];
    }
    buildCombinedList();
  }

  function buildCombinedList() {
    combinedList = [];
    allData.launcher.forEach(function(v){
      combinedList.push(Object.assign({}, v, { type: 'launcher' }));
    });
    allData.game.forEach(function(v){
      combinedList.push(Object.assign({}, v, { type: 'game' }));
    });
    combinedList.sort(function(a, b){
      return b.date.localeCompare(a.date) || b.version.localeCompare(a.version);
    });
  }

  /* === Render Latest Cards === */
  function renderLatestCards() {
    var latestLauncher = allData.launcher[0] || null;
    var latestGame = allData.game[0] || null;
    var html = '';

    // Launcher card
    html += '<div class="latest-card latest-card--launcher">';
    html += '<div class="latest-card-header">';
    html += '<div class="latest-card-icon">' + ICONS.phone + '</div>';
    html += '<span class="latest-card-type">APK 启动器</span>';
    html += '<span class="latest-badge">最新</span>';
    html += '</div>';
    if (latestLauncher) {
      html += '<div class="latest-version">' + esc(latestLauncher.version) + '</div>';
      html += '<div class="latest-meta">';
      html += '<span class="latest-meta-item">' + ICONS.calendar + esc(latestLauncher.date) + '</span>';
      html += '<span class="latest-meta-item">' + ICONS.hardrive + esc(latestLauncher.size) + '</span>';
      html += '</div>';
      if (latestLauncher.requiredGameVersion) {
        var compatClass = 'latest-compat';
        if (latestGame && latestLauncher.requiredGameVersion.indexOf(latestGame.version.replace('v','')) === -1) {
          compatClass += ' latest-compat--warn';
        }
        html += '<div class="' + compatClass + '">' + ICONS.info + ' 需配合游戏本体 ' + esc(latestLauncher.requiredGameVersion) + '</div>';
      }
      html += '<div class="latest-actions">';
      latestLauncher.downloadLinks.forEach(function(dl){
        html += '<a href="' + esc(dl.url) + '" target="_blank" rel="noopener" class="btn-download">' + ICONS.download + esc(dl.text) + '</a>';
      });
      html += '<a href="#timeline-section" class="btn-history">' + ICONS.arrowDown + ' 历史版本</a>';
      html += '</div>';
    } else {
      html += '<div class="latest-version">暂无</div>';
      html += '<p style="color:var(--text-muted);font-size:.88rem">暂无启动器版本信息</p>';
    }
    html += '</div>';

    // Game card
    html += '<div class="latest-card latest-card--game">';
    html += '<div class="latest-card-header">';
    html += '<div class="latest-card-icon">' + ICONS.package + '</div>';
    html += '<span class="latest-card-type">游戏本体</span>';
    html += '<span class="latest-badge">最新</span>';
    html += '</div>';
    if (latestGame) {
      html += '<div class="latest-version">' + esc(latestGame.version) + '</div>';
      html += '<div class="latest-meta">';
      html += '<span class="latest-meta-item">' + ICONS.calendar + esc(latestGame.date) + '</span>';
      html += '<span class="latest-meta-item">' + ICONS.hardrive + esc(latestGame.size) + '</span>';
      html += '</div>';
      html += '<div class="latest-actions">';
      latestGame.downloadLinks.forEach(function(dl){
        html += '<a href="' + esc(dl.url) + '" target="_blank" rel="noopener" class="btn-download">' + ICONS.download + esc(dl.text) + '</a>';
      });
      html += '<a href="#timeline-section" class="btn-history">' + ICONS.arrowDown + ' 历史版本</a>';
      html += '</div>';
    } else {
      html += '<div class="latest-version">暂无</div>';
      html += '<p style="color:var(--text-muted);font-size:.88rem">暂无游戏本体版本信息</p>';
    }
    html += '</div>';

    latestGrid.innerHTML = html;
  }

  /* === Render Timeline === */
  function renderTimeline() {
    var filtered = combinedList.slice();

    // Filter by type
    if (activeFilter !== 'all') {
      filtered = filtered.filter(function(v){ return v.type === activeFilter; });
    }

    // Filter by search
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      filtered = filtered.filter(function(v){
        return v.version.toLowerCase().indexOf(q) !== -1 ||
               v.changelog.toLowerCase().indexOf(q) !== -1;
      });
    }

    if (filtered.length === 0) {
      timeline.innerHTML = '<div class="empty-state">' + ICONS.empty + '<p>没有找到匹配的版本</p></div>';
      return;
    }

    var latestLauncherVersion = (allData.launcher[0] || {}).version;
    var latestGameVersion = (allData.game[0] || {}).version;

    var html = '';
    filtered.forEach(function(v, idx) {
      var isLatest = (v.type === 'launcher' && v.version === latestLauncherVersion) ||
                    (v.type === 'game' && v.version === latestGameVersion);
      var typeLabel = v.type === 'launcher' ? '启动器' : '游戏本体';
      var nodeClass = v.type === 'launcher' ? 'timeline-node--launcher' : 'timeline-node--game';
      var tagClass = v.type === 'launcher' ? 'timeline-type-tag--launcher' : 'timeline-type-tag--game';
      var nodeIcon = v.type === 'launcher' ? ICONS.phone : ICONS.package;

      html += '<div class="timeline-item" style="animation-delay:' + (idx * 0.06) + 's">';

      // Node
      html += '<div class="timeline-node ' + nodeClass + '">' + nodeIcon + '</div>';

      // Card
      html += '<div class="timeline-card">';
      html += '<div class="timeline-card-header">';
      html += '<span class="timeline-version">' + esc(v.version) + '</span>';
      html += '<span class="timeline-type-tag ' + tagClass + '">' + typeLabel + '</span>';
      if (isLatest) html += '<span class="timeline-new-badge">最新</span>';
      html += '<span class="timeline-date">' + esc(v.date) + '</span>';
      html += '</div>';

      // Info
      html += '<div class="timeline-info">';
      html += '<span class="timeline-info-item">' + ICONS.hardrive + esc(v.size) + '</span>';
      if (v.requiredGameVersion) {
        html += '<span class="timeline-compat">' + ICONS.info + '需本体 ' + esc(v.requiredGameVersion) + '</span>';
      }
      html += '</div>';

      // Changelog
      if (v.changelog) {
        var changelogId = 'cl-' + v.type + '-' + idx;
        html += '<div class="timeline-changelog" id="' + changelogId + '">' + esc(v.changelog) + '</div>';
        html += '<button class="changelog-toggle" data-target="' + changelogId + '">展开</button>';
      }

      // Downloads
      html += '<div class="timeline-downloads">';
      v.downloadLinks.forEach(function(dl){
        html += '<a href="' + esc(dl.url) + '" target="_blank" rel="noopener" class="btn-dl">' + ICONS.download + esc(dl.text) + '</a>';
      });
      html += '</div>';

      html += '</div>'; // card
      html += '</div>'; // item
    });

    timeline.innerHTML = html;

    // Bind changelog toggles
    timeline.querySelectorAll('.changelog-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var target = document.getElementById(btn.dataset.target);
        if (!target) return;
        var expanded = target.classList.toggle('expanded');
        btn.textContent = expanded ? '收起' : '展开';
      });
    });

    // Add id for anchor link
    var section = timeline.closest('.timeline-section');
    if (section) section.id = 'timeline-section';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  /* === Filter Logic === */
  filterTags.addEventListener('click', function(e){
    var tag = e.target.closest('.filter-tag');
    if (!tag) return;
    filterTags.querySelectorAll('.filter-tag').forEach(function(t){ t.classList.remove('active'); });
    tag.classList.add('active');
    activeFilter = tag.dataset.filter;
    renderTimeline();
  });

  searchInput.addEventListener('input', function(){
    searchQuery = this.value.trim();
    renderTimeline();
  });

  /* === Init === */
  async function init() {
    await loadData();
    renderLatestCards();
    renderTimeline();
    loadingOverlay.classList.add('hidden');
    mainContent.style.opacity = '1';
  }

  init();
})();
</script>
</body>
</html>
