<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔Ⅱ手机版资源下载</title>
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #faf7f4;
  --strawberry-milk: #e89b9b;
  --strawberry-light: #f5c4c4;
  --mint-jelly: #a8d8c8;
  --mint-light: #c8ece0;
  --cream-yellow: #fbe8c3;
  --cream-light: #fdf3dc;
  --lavender: #c8b8d8;
  --lavender-light: #dfd4ea;
  --border-dark: #4a4458;
  --text-primary: #3d3648;
  --text-secondary: #6b6378;
  --text-muted: #9a92a5;
  --shadow-soft: 0 4px 20px rgba(74, 68, 88, 0.08);
  --shadow-medium: 0 8px 32px rgba(74, 68, 88, 0.13);
  --shadow-deep: 0 14px 44px rgba(74, 68, 88, 0.18);
  --radius-xl: 28px;
  --border-width: 2.5px;
  --font-title: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --font-body: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background-color: var(--bg);
  background-image:
    radial-gradient(ellipse at 15% 20%, rgba(232,155,155,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 78% 65%, rgba(168,216,200,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 40% 80%, rgba(200,184,216,0.05) 0%, transparent 50%),
    radial-gradient(circle at 60% 30%, rgba(251,232,195,0.06) 0%, transparent 45%);
  background-attachment: fixed;
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.page-container {
  max-width: 860px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

/* 返回链接 */
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  text-decoration: none;
  color: var(--text-muted);
  font-size: 0.85rem;
  border-radius: 8px;
  transition: all 0.2s ease;
  border: 1px solid transparent;
  margin-bottom: 20px;
}
.back-link:hover {
  background: #fff;
  color: var(--text-primary);
  border-color: #e8e2dc;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

/* 页面标题 */
.page-header { margin-bottom: 28px; }
.page-title {
  font-family: var(--font-title);
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-bottom: 6px;
}
.page-title-accent {
  color: var(--strawberry-milk);
}
.page-subtitle {
  font-size: 0.92rem;
  color: var(--text-secondary);
  font-weight: 400;
}

/* 最新启动器卡片 */
.latest-card {
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: var(--radius-xl);
  padding: 26px 28px;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 28px;
  transition: transform 0.3s var(--transition-bounce), box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
}
.latest-card::before {
  content: '';
  position: absolute;
  top: -30px;
  right: -30px;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(232,155,155,0.1) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.latest-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-medium);
}
.latest-icon-wrap {
  flex-shrink: 0;
  width: 72px;
  height: 72px;
  border-radius: 18px;
  overflow: hidden;
  border: 2px solid #e8e2dc;
  background: #f5f2ef;
  display: flex;
  align-items: center;
  justify-content: center;
}
.latest-icon-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.latest-info { flex: 1; min-width: 0; }
.latest-label {
  display: inline-block;
  padding: 3px 12px;
  background: var(--strawberry-light);
  color: #b05a5a;
  font-size: 0.72rem;
  font-weight: 700;
  border-radius: 20px;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}
.latest-name {
  font-family: var(--font-title);
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 4px;
}
.latest-meta {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 8px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.latest-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.latest-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.latest-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn-download {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 24px;
  background: var(--strawberry-milk);
  color: #fff;
  border: var(--border-width) solid #c97a7a;
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-download:hover {
  background: #fff;
  color: var(--strawberry-milk);
  transform: scale(1.05);
}
.btn-tutorial {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 22px;
  background: #fffdfb;
  color: var(--text-primary);
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-tutorial:hover {
  background: var(--mint-light);
  border-color: #7cb8a4;
  transform: scale(1.05);
}

/* 搜索区域 */
.search-section { margin-bottom: 6px; position: relative; z-index: 50; }
.search-container { position: relative; }
.search-input {
  width: 100%;
  padding: 14px 48px 14px 22px;
  font-size: 0.95rem;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 50px;
  background: #fffdfb;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s;
  box-shadow: var(--shadow-soft);
  font-family: var(--font-body);
}
.search-input:focus {
  box-shadow: var(--shadow-deep);
  border-color: var(--strawberry-milk);
}
.search-input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  color: var(--text-muted);
  pointer-events: none;
}
.search-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 6px;
  right: 6px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 22px;
  box-shadow: var(--shadow-medium);
  z-index: 200;
  max-height: 280px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition: all 0.25s;
  list-style: none;
  padding: 6px 0;
}
.search-dropdown.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.search-dropdown-item {
  padding: 11px 20px;
  cursor: pointer;
  font-size: 0.9rem;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s;
}
.search-dropdown-item:hover {
  background: #fef0f0;
}
.search-dropdown-item mark {
  background: var(--cream-yellow);
  color: var(--text-primary);
  padding: 1px 3px;
  border-radius: 3px;
}
.search-item-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 600;
  flex-shrink: 0;
}
.search-item-tag.launcher {
  background: var(--lavender-light);
  color: #6b5a8a;
}
.search-item-tag.gamepack {
  background: var(--mint-light);
  color: #3d6b4f;
}
.search-dropdown-empty {
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 0.88rem;
}

/* 标签页 + 标题 行 */
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin: 24px 0 18px;
  flex-wrap: wrap;
}
.history-title {
  font-size: 1.25rem;
  font-weight: 700;
  position: relative;
  padding-left: 14px;
  white-space: nowrap;
}
.history-title::before {
  content: '';
  position: absolute;
  left: 0;
  top: 3px;
  bottom: 3px;
  width: 5px;
  background: var(--strawberry-milk);
  border-radius: 3px;
}
.tab-group {
  display: flex;
  gap: 0;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  overflow: hidden;
  background: #fffdfb;
  box-shadow: var(--shadow-soft);
}
.tab-btn {
  padding: 9px 22px;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-secondary);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.25s;
  font-family: var(--font-body);
  position: relative;
  white-space: nowrap;
}
.tab-btn + .tab-btn {
  border-left: 2px solid #e8e2dc;
}
.tab-btn.active {
  background: var(--strawberry-light);
  color: #fff;
}
.tab-btn.active + .tab-btn,
.tab-btn + .tab-btn.active {
  border-left-color: #c97a7a;
}
.tab-btn:hover:not(.active) {
  background: #fef5f0;
  color: var(--text-primary);
}

/* 历史版本卡片网格 */
.version-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.version-card {
  background: #fffdfb;
  border: 2px solid #e8e2dc;
  border-radius: 20px;
  padding: 20px;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: 0 2px 10px rgba(74,68,88,0.04);
  display: flex;
  flex-direction: column;
}
.version-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-medium);
  border-color: #d5cdc0;
}
.version-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.version-number {
  font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', monospace;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0.02em;
}
.version-badge {
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.version-badge.stable {
  background: var(--mint-light);
  color: #3d6b4f;
}
.version-badge.beta {
  background: var(--cream-light);
  color: #8a7340;
}
.version-badge.latest {
  background: var(--strawberry-light);
  color: #b05a5a;
}
.version-meta {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
.version-desc {
  font-size: 0.85rem;
  color: var(--text-secondary);
  line-height: 1.55;
  margin-bottom: 14px;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.version-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.btn-small-download {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 8px 18px;
  background: var(--strawberry-milk);
  color: #fff;
  border: 2px solid #c97a7a;
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.82rem;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.3s var(--transition-bounce);
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-small-download:hover {
  background: #fff;
  color: var(--strawberry-milk);
  transform: scale(1.05);
}
.btn-small-copy {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 8px 14px;
  background: #fffdfb;
  color: var(--text-secondary);
  border: 2px solid #e8e2dc;
  border-radius: 30px;
  font-weight: 600;
  font-size: 0.82rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-body);
  white-space: nowrap;
}
.btn-small-copy:hover {
  background: #f5f2ef;
  border-color: #d5cdc0;
}
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
  font-size: 0.92rem;
}

/* 分页器 - 1:1复刻主站 */
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin: 30px 0 40px;
  flex-wrap: nowrap;
  overflow: hidden;
}
.pagination-btn, .pagination-page {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding: 0 12px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.pagination-btn:hover:not(:disabled), .pagination-page:hover:not(.active) {
  background: var(--strawberry-light);
  color: #fff;
  border-color: #c97a7a;
  transform: scale(1.07);
}
.pagination-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}
.pagination-page.active {
  background: var(--strawberry-milk);
  color: #fff;
  border-color: #c97a7a;
  box-shadow: 0 2px 12px rgba(232,155,155,0.3);
}
.pagination-dots {
  color: var(--text-muted);
  font-weight: 600;
  padding: 0 4px;
  user-select: none;
}
.pagination-goto {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: 10px;
  flex-shrink: 0;
}
.pagination-goto-input {
  width: 52px;
  height: 40px;
  padding: 0 10px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  text-align: center;
  outline: none;
  box-shadow: var(--shadow-soft);
  transition: all 0.3s var(--transition-bounce);
  -moz-appearance: textfield;
}
.pagination-goto-input::-webkit-outer-spin-button,
.pagination-goto-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.pagination-goto-input:focus {
  border-color: var(--strawberry-milk);
  box-shadow: var(--shadow-deep);
}
.pagination-goto-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 40px;
  height: 40px;
  padding: 0 14px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 30px;
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
  box-shadow: var(--shadow-soft);
  user-select: none;
}
.pagination-goto-btn:hover {
  background: var(--strawberry-light);
  color: #fff;
  border-color: #c97a7a;
  transform: scale(1.07);
}
.pagination-goto-mobile-trigger {
  display: none;
}
@media (max-width: 480px) {
  .pagination { gap: 6px; }
  .pagination-btn, .pagination-page { min-width: 32px; height: 32px; font-size: 0.8rem; padding: 0 8px; }
  .pagination-dots { font-size: 0.8rem; padding: 0 2px; }
  .pagination-goto-input, .pagination-goto-btn { display: none; }
  .pagination-goto-mobile-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 8px;
    background: #fffdfb;
    border: var(--border-width) solid var(--border-dark);
    border-radius: 30px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: all 0.3s var(--transition-bounce);
    user-select: none;
  }
  .pagination-goto-mobile-trigger:hover {
    background: var(--strawberry-light);
    color: #fff;
    border-color: #c97a7a;
  }
  .pagination-goto { margin-left: 6px; }
}

/* 跳转弹窗 */
.goto-popup-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.25);
  z-index: 700;
  align-items: flex-end;
  justify-content: center;
}
.goto-popup-overlay.active { display: flex; }
.goto-popup {
  width: 100%;
  max-width: 360px;
  background: #fffdfb;
  border: var(--border-width) solid var(--border-dark);
  border-radius: 24px 24px 0 0;
  padding: 24px 20px 32px;
  box-shadow: var(--shadow-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: popupSlideUp 0.3s var(--transition-bounce);
}
@keyframes popupSlideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.goto-popup-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
.goto-popup-row { display: flex; align-items: center; gap: 10px; }
.goto-popup-input {
  width: 80px; height: 44px; padding: 0 14px;
  background: #fffdfb; border: var(--border-width) solid var(--border-dark);
  border-radius: 30px; font-family: var(--font-body);
  font-size: 1rem; font-weight: 600; color: var(--text-primary);
  text-align: center; outline: none; -moz-appearance: textfield;
}
.goto-popup-input::-webkit-outer-spin-button,
.goto-popup-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.goto-popup-input:focus { border-color: var(--strawberry-milk); }
.goto-popup-confirm {
  height: 44px; padding: 0 24px;
  background: var(--strawberry-milk); color: #fff;
  border: var(--border-width) solid #c97a7a;
  border-radius: 30px; font-family: var(--font-body);
  font-size: 0.92rem; font-weight: 700; cursor: pointer;
  transition: all 0.3s var(--transition-bounce);
}
.goto-popup-confirm:hover { background: #fff; color: var(--strawberry-milk); transform: scale(1.05); }
@media (min-width: 481px) {
  .goto-popup-overlay { display: none !important; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(120px);
  background: #fffefb;
  border: 1.5px solid #d5cdc0;
  border-radius: 24px;
  padding: 10px 22px;
  font-weight: 550;
  font-size: 0.88rem;
  color: var(--text-primary);
  box-shadow: var(--shadow-deep);
  transition: transform 0.35s cubic-bezier(0.34,1.4,0.64,1);
  z-index: 600;
  white-space: nowrap;
  letter-spacing: 0.02em;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Footer */
.footer {
  text-align: center;
  padding: 30px 4px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.footer a {
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s;
}
.footer a:hover { color: var(--text-secondary); }

/* 响应式 */
@media (max-width: 640px) {
  .page-container { padding: 20px 16px 50px; }
  .latest-card { flex-direction: column; text-align: center; padding: 22px 20px; gap: 16px; }
  .latest-actions { justify-content: center; }
  .version-grid { grid-template-columns: 1fr; }
  .history-header { flex-direction: column; align-items: flex-start; gap: 12px; }
}
@media (max-width: 480px) {
  .page-title { font-size: 1.4rem; }
  .latest-icon-wrap { width: 60px; height: 60px; border-radius: 14px; }
  .latest-name { font-size: 1.05rem; }
  .version-card { padding: 16px; }
}
</style>
</head>
<body>

  ];

  var GAMEPACK_DATA = [

    { id:'G004', version:'v0.103.1', date:'2026-04-25', size:'848MB', desc:'小幅优化性能表现，修复偶现的黑屏问题', stability:'stable', isLatest:false, downloadUrl:'#' },
    { id:'G005', version:'v0.103.0', date:'2026-04-15', size:'845MB', desc:'大版本更新，新增角色与地图，调整核心机制', stability:'stable', isLatest:false, downloadUrl:'#' },
    { id:'G006', version:'v0.102.0', date:'2026-04-01', size:'830MB', desc:'新增遗物与事件，优化Boss战AI逻辑', stability:'stable', isLatest:false, downloadUrl:'#' },
    { id:'G007', version:'v0.101.0', date:'2026-03-20', size:'820MB', desc:'优化游戏平衡性，调整卡牌数值', stability:'stable', isLatest:false, downloadUrl:'#' },
    { id:'G008', version:'v0.100.0', date:'2026-03-10', size:'810MB', desc:'首个公测版本，基础游戏功能完整', stability:'stable', isLatest:false, downloadUrl:'#' },
    { id:'G009', version:'v0.99.0', date:'2026-02-25', size:'795MB', desc:'内测版本，新增部分卡牌与遗物', stability:'beta', isLatest:false, downloadUrl:'#' },
    { id:'G010', version:'v0.98.0', date:'2026-02-10', size:'780MB', desc:'早期内测版本，基础框架搭建完成', stability:'beta', isLatest:false, downloadUrl:'#' }
  ];

  /* ===== 状态 ===== */
  var activeTab = 'launcher';
  var currentPage = 1;
  var ITEMS_PER_PAGE = 8;
  var searchQuery = '';
  var toastTimer;

  /* ===== DOM引用 ===== */
  var latestCard = document.getElementById('latestCard');
  var versionGrid = document.getElementById('versionGrid');
  var paginationEl = document.getElementById('pagination');
  var searchInput = document.getElementById('searchInput');
  var searchDropdown = document.getElementById('searchDropdown');
  var searchContainer = document.getElementById('searchContainer');
  var tabLauncher = document.getElementById('tabLauncher');
  var tabGamepack = document.getElementById('tabGamepack');
  var toast = document.getElementById('toast');

  /* ===== 工具函数 ===== */
  function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.classList.add('show');
    toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function(resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none;';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); document.body.removeChild(ta); resolve(); }
      catch(e) { document.body.removeChild(ta); reject(e); }
    });
  }

  function escapeHtml(text) {
    var d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function getCurrentData() {
    return activeTab === 'launcher' ? LAUNCHER_DATA : GAMEPACK_DATA;
  }

  function getFilteredData() {
    var data = getCurrentData();
    // 去掉最新版（已在顶部展示或不需要展示）
    var history = data.filter(function(item) { return !item.isLatest; });
    if (!searchQuery) return history;
    var q = searchQuery.toLowerCase();
    return history.filter(function(item) {
      return item.version.toLowerCase().indexOf(q) !== -1 ||
             item.desc.toLowerCase().indexOf(q) !== -1 ||
             item.date.indexOf(q) !== -1;
    });
  }

  /* ===== 渲染最新启动器 ===== */
  function renderLatestCard() {
    var latest = LAUNCHER_DATA.find(function(item) { return item.isLatest; });
    if (!latest) { latestCard.style.display = 'none'; return; }
    latestCard.innerHTML =
      '<div class="latest-icon-wrap">' +
        '<img src="' + LAUNCHER_ICON + '" alt="启动器图标" width="100" height="100">' +
      '</div>' +
      '<div class="latest-info">' +
        '<span class="latest-label">最新版</span>' +
        '<div class="latest-name">STS2 安卓启动器</div>' +
        '<div class="latest-meta">' +
          '<span class="latest-meta-item">' + escapeHtml(latest.version) + '</span>' +
          '<span class="latest-meta-item">' + escapeHtml(latest.date) + '</span>' +
          '<span class="latest-meta-item">' + escapeHtml(latest.size) + '</span>' +
        '</div>' +
        '<div class="latest-desc">' + escapeHtml(latest.desc) + '</div>' +
        '<div class="latest-actions">' +
          '<a class="btn-download" href="' + latest.downloadUrl + '" target="_blank" rel="noopener">' +
            '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>' +
            '下载最新版</a>' +
          '<a class="btn-tutorial" href="' + TUTORIAL_URL + '" target="_blank" rel="noopener">' +
            '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>' +
            '使用教程</a>' +
        '</div>' +
      '</div>';
  }

  /* ===== 渲染历史版本卡片 ===== */
  function renderVersionCards(dataSlice) {
    versionGrid.innerHTML = '';
    if (dataSlice.length === 0) {
      versionGrid.innerHTML = '<div class="empty-state">没有找到匹配的版本</div>';
      return;
    }
    dataSlice.forEach(function(item) {
      var stabilityText = item.stability === 'beta' ? '测试版' : '稳定版';
      var stabilityClass = item.stability === 'beta' ? 'beta' : 'stable';
      var card = document.createElement('div');
      card.className = 'version-card';
      card.innerHTML =
        '<div class="version-card-top">' +
          '<span class="version-number">' + escapeHtml(item.version) + '</span>' +
          '<span class="version-badge ' + stabilityClass + '">' + stabilityText + '</span>' +
        '</div>' +
        '<div class="version-meta">' +
          '<span>' + escapeHtml(item.date) + '</span>' +
          '<span>' + escapeHtml(item.size) + '</span>' +
        '</div>' +
        '<div class="version-desc">' + escapeHtml(item.desc) + '</div>' +
        '<div class="version-actions">' +
          '<a class="btn-small-download" href="' + item.downloadUrl + '" target="_blank" rel="noopener">下载</a>' +
          '<button class="btn-small-copy" data-url="' + escapeHtml(item.downloadUrl) + '">复制链接</button>' +
        '</div>';
      // 绑定复制事件
      card.querySelector('.btn-small-copy').addEventListener('click', function() {
        var url = this.getAttribute('data-url');
        copyText(url).then(function() {
          showToast('下载链接已复制');
        }).catch(function() {
          showToast('复制失败，请手动复制');
        });
      });
      versionGrid.appendChild(card);
    });
  }

  /* ===== 分页器 - 1:1复刻主站逻辑 ===== */
  function renderPagination(totalItems, currentPageNum) {
    paginationEl.innerHTML = '';
    var totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);
    if (totalPages <= 1) return;

    function createBtn(cls, content, disabled, handler) {
      var btn = document.createElement('button');
      btn.className = cls;
      btn.innerHTML = content;
      btn.style.flexShrink = '1';
      btn.style.minWidth = '0';
      if (disabled) btn.disabled = true;
      if (handler) btn.addEventListener('click', handler);
      return btn;
    }

    function createPageBtn(pageNum) {
      return createBtn('pagination-page' + (pageNum === currentPageNum ? ' active' : ''), pageNum, false, function() {
        currentPage = pageNum;
        renderPage(pageNum);
        versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }

    function createDots() {
      var span = document.createElement('span');
      span.className = 'pagination-dots';
      span.textContent = '...';
      span.style.flexShrink = '1';
      span.style.minWidth = '0';
      return span;
    }

    var items = [];
    items.push(createBtn('pagination-btn', '&#8249;', currentPageNum <= 1, function() {
      if (currentPageNum > 1) { currentPage--; renderPage(currentPage); versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }));
    items.push(createPageBtn(1));

    if (totalPages <= 4) {
      for (var i = 2; i <= totalPages; i++) items.push(createPageBtn(i));
    } else {
      if (currentPageNum <= 4) {
        for (var j = 2; j <= 4; j++) items.push(createPageBtn(j));
        items.push(createDots());
        items.push(createPageBtn(totalPages));
      } else {
        items.push(createDots());
        if (currentPageNum - 1 > 1) items.push(createPageBtn(currentPageNum - 1));
        items.push(createPageBtn(currentPageNum));
        if (currentPageNum + 1 < totalPages) items.push(createPageBtn(currentPageNum + 1));
        items.push(createDots());
        items.push(createPageBtn(totalPages));
      }
    }

    items.push(createBtn('pagination-btn', '&#8250;', currentPageNum >= totalPages, function() {
      if (currentPageNum < totalPages) { currentPage++; renderPage(currentPage); versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }));

    items.forEach(function(item) { paginationEl.appendChild(item); });

    // 跳转区域
    var gotoWrap = document.createElement('span');
    gotoWrap.className = 'pagination-goto';
    gotoWrap.style.flexShrink = '0';
    gotoWrap.style.marginLeft = '8px';

    var gotoInput = document.createElement('input');
    gotoInput.type = 'text';
    gotoInput.className = 'pagination-goto-input';
    gotoInput.placeholder = '\\';
    gotoInput.maxLength = 3;
    gotoInput.setAttribute('aria-label', '输入页码');

    var gotoBtn = document.createElement('button');
    gotoBtn.className = 'pagination-goto-btn';
    gotoBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
    gotoBtn.setAttribute('aria-label', '跳转到指定页');

    var gotoMobile = document.createElement('button');
    gotoMobile.className = 'pagination-goto-mobile-trigger';
    gotoMobile.innerHTML = '<svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
    gotoMobile.setAttribute('aria-label', '跳转页码');

    function doGoto(value) {
      var num = parseInt(value, 10);
      if (isNaN(num) || num < 1 || num > totalPages) {
        showToast('页码范围：1 ~ ' + totalPages);
        return;
      }
      currentPage = num;
      renderPage(num);
      gotoInput.value = '';
      versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    gotoInput.addEventListener('input', function() {
      this.value = this.value.replace(/[^\d]/g, '').slice(0, 3);
    });
    gotoInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doGoto(this.value);
    });
    gotoBtn.addEventListener('click', function() { doGoto(gotoInput.value); });
    gotoMobile.addEventListener('click', function() { openGotoPopup(totalPages); });

    gotoWrap.appendChild(gotoInput);
    gotoWrap.appendChild(gotoBtn);
    gotoWrap.appendChild(gotoMobile);
    paginationEl.appendChild(gotoWrap);
  }

  function openGotoPopup(totalPages) {
    var existing = document.getElementById('gotoPopupOverlay');
    if (existing) existing.remove();
    var overlay = document.createElement('div');
    overlay.className = 'goto-popup-overlay active';
    overlay.id = 'gotoPopupOverlay';
    var popup = document.createElement('div');
    popup.className = 'goto-popup';
    var title = document.createElement('div');
    title.className = 'goto-popup-title';
    title.textContent = '跳转到第几页？(共 ' + totalPages + ' 页)';
    var row = document.createElement('div');
    row.className = 'goto-popup-row';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'goto-popup-input';
    input.placeholder = '页码';
    input.maxLength = 3;
    input.inputMode = 'numeric';
    input.addEventListener('input', function() { this.value = this.value.replace(/[^\d]/g, '').slice(0, 3); });
    var confirmBtn = document.createElement('button');
    confirmBtn.className = 'goto-popup-confirm';
    confirmBtn.textContent = '跳转';
    function doMobileGoto() {
      var num = parseInt(input.value, 10);
      if (isNaN(num) || num < 1 || num > totalPages) { showToast('页码范围：1 ~ ' + totalPages); return; }
      currentPage = num;
      renderPage(num);
      overlay.remove();
      setTimeout(function() { versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    }
    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') doMobileGoto(); });
    confirmBtn.addEventListener('click', doMobileGoto);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    row.appendChild(input);
    row.appendChild(confirmBtn);
    popup.appendChild(title);
    popup.appendChild(row);
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    setTimeout(function() { input.focus(); }, 100);
  }

  /* ===== 渲染页面 ===== */
  function renderPage(pageNum) {
    var filtered = getFilteredData();
    var start = (pageNum - 1) * ITEMS_PER_PAGE;
    var end = start + ITEMS_PER_PAGE;
    var pageData = filtered.slice(start, end);
    renderVersionCards(pageData);
    renderPagination(filtered.length, pageNum);
  }

  /* ===== 搜索下拉 ===== */
  function updateSearchDropdown(query) {
    searchDropdown.innerHTML = '';
    if (!query || query.length < 1) {
      searchDropdown.classList.remove('active');
      return;
    }
    var q = query.toLowerCase();
    var results = [];

    // 搜索启动器
    LAUNCHER_DATA.forEach(function(item) {
      if (item.version.toLowerCase().indexOf(q) !== -1 || item.desc.toLowerCase().indexOf(q) !== -1) {
        results.push({ item: item, type: 'launcher' });
      }
    });
    // 搜索游戏本体
    GAMEPACK_DATA.forEach(function(item) {
      if (item.version.toLowerCase().indexOf(q) !== -1 || item.desc.toLowerCase().indexOf(q) !== -1) {
        results.push({ item: item, type: 'gamepack' });
      }
    });

    if (results.length === 0) {
      searchDropdown.innerHTML = '<li class="search-dropdown-empty">没有找到匹配的版本</li>';
    } else {
      var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var regex = new RegExp('(' + escapedQuery + ')', 'gi');
      results.slice(0, 8).forEach(function(r) {
        var li = document.createElement('li');
        li.className = 'search-dropdown-item';
        var tagLabel = r.type === 'launcher' ? '启动器' : '游戏本体';
        var tagClass = r.type;
        var highlightedVersion = r.item.version.replace(regex, '<mark>$1</mark>');
        var highlightedDesc = r.item.desc.replace(regex, '<mark>$1</mark>');
        // 截断描述
        var shortDesc = r.item.desc.length > 30 ? r.item.desc.substring(0, 30) + '...' : r.item.desc;
        shortDesc = shortDesc.replace(regex, '<mark>$1</mark>');
        li.innerHTML =
          '<span class="search-item-tag ' + tagClass + '">' + tagLabel + '</span>' +
          '<span>' + highlightedVersion + ' - ' + shortDesc + '</span>';
        li.addEventListener('click', function() {
          // 切换到对应标签页并搜索
          if (activeTab !== r.type) {
            activeTab = r.type;
            updateTabUI();
          }
          searchInput.value = r.item.version;
          searchQuery = r.item.version;
          currentPage = 1;
          renderPage(1);
          searchDropdown.classList.remove('active');
          versionGrid.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        searchDropdown.appendChild(li);
      });
    }
    searchDropdown.classList.add('active');
  }

  function filterAndRender() {
    searchQuery = searchInput.value.trim();
    currentPage = 1;
    renderPage(1);
  }

  /* ===== 标签页切换 ===== */
  function updateTabUI() {
    tabLauncher.classList.toggle('active', activeTab === 'launcher');
    tabGamepack.classList.toggle('active', activeTab === 'gamepack');
  }

  tabLauncher.addEventListener('click', function() {
    if (activeTab === 'launcher') return;
    activeTab = 'launcher';
    currentPage = 1;
    searchQuery = '';
    searchInput.value = '';
    searchDropdown.classList.remove('active');
    updateTabUI();
    renderPage(1);
  });

  tabGamepack.addEventListener('click', function() {
    if (activeTab === 'gamepack') return;
    activeTab = 'gamepack';
    currentPage = 1;
    searchQuery = '';
    searchInput.value = '';
    searchDropdown.classList.remove('active');
    updateTabUI();
    renderPage(1);
  });

  /* ===== 搜索事件 ===== */
  searchInput.addEventListener('input', function() {
    var val = this.value.trim();
    updateSearchDropdown(val);
    filterAndRender();
  });

  searchInput.addEventListener('focus', function() {
    if (this.value.trim().length >= 1) updateSearchDropdown(this.value.trim());
  });

  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { searchDropdown.classList.remove('active'); searchInput.blur(); }
    if (e.key === 'Enter') { searchDropdown.classList.remove('active'); filterAndRender(); }
  });

  document.addEventListener('click', function(e) {
    if (!searchContainer.contains(e.target)) searchDropdown.classList.remove('active');
  });

  /* ===== 初始化 ===== */
  function init() {
    renderLatestCard();
    updateTabUI();
    renderPage(1);
  }

  init();
})();
</script>
</body>
</html>
