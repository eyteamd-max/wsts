:root {

  --border-dark: #4a4458;
  --text-primary: #3d3648;
  --text-secondary: #6b6378;
  --text-muted: #9a92a5;
  --shadow-soft: 0 4px 20px rgba(74,68,88,0.08);
  --shadow-medium: 0 8px 32px rgba(74,68,88,0.13);
  --shadow-deep: 0 14px 44px rgba(74,68,88,0.18);
  --radius-xl: 28px;
  --border-width: 2.5px;
  --font-title: 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --font-body: 'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;
  --transition-bounce: cubic-bezier(0.34,1.56,0.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background-color:var(--bg);
  background-image:

  background-attachment:fixed;
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.page-container{max-width:820px;margin:0 auto;padding:28px 22px 60px}
.page-header{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;background:#fffdfb;
  border:var(--border-width) solid var(--border-dark);border-radius:20px;
  color:var(--text-primary);font-weight:600;font-size:0.88rem;
  text-decoration:none;transition:all 0.3s var(--transition-bounce);
  box-shadow:var(--shadow-soft);flex-shrink:0;
}
.back-btn:hover{background:var(--strawberry-light);color:#fff;border-color:#c97a7a;transform:translateY(-2px)}
.page-title{font-family:var(--font-title);font-size:1.45rem;font-weight:700;white-space:nowrap}
.page-title::after{
  content:'';display:inline-block;width:8px;height:8px;
  background:var(--strawberry-milk);border-radius:50%;margin-left:6px;
  vertical-align:middle;animation:dotPulse 2s ease-in-out infinite;
}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.8);opacity:0.3}}

.latest-section{margin-bottom:28px}
.latest-card{
  background:#fffdfb;border:var(--border-width) solid var(--border-dark);
  border-radius:var(--radius-xl);padding:24px;box-shadow:var(--shadow-soft);
  display:flex;gap:20px;align-items:flex-start;
  transition:all 0.35s var(--transition-bounce);position:relative;overflow:hidden;
}
.latest-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-deep)}
.latest-card::after{
  content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  background:rgba(232,155,155,0.08);border-radius:50%;pointer-events:none;
}
.latest-icon{
  width:64px;height:64px;border-radius:16px;object-fit:cover;flex-shrink:0;
  border:2px solid var(--border-dark);background:#f5f2f8;
}
.latest-info{flex:1;min-width:0}
.latest-label{
  font-size:0.76rem;color:var(--text-muted);font-weight:600;
  letter-spacing:0.05em;margin-bottom:3px;
}
.latest-version{font-family:var(--font-title);font-size:1.3rem;font-weight:700;margin-bottom:6px}
.latest-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.meta-tag{
  padding:4px 12px;background:#f5f2f8;border:2px solid #ddd8e5;border-radius:20px;
  font-size:0.78rem;color:var(--text-secondary);font-weight:500;
}
.meta-hint{font-size:0.72rem;color:var(--strawberry-milk);font-weight:500}
.latest-desc{
  font-size:0.88rem;color:var(--text-secondary);line-height:1.65;margin-bottom:16px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:all 0.3s ease;
}
.latest-desc.expanded{-webkit-line-clamp:unset;display:block}
.desc-toggle{

  font-size:0.85rem;margin-top:2px;display:inline-block;transition:color 0.2s;
}
.desc-toggle:hover{color:#c97a7a;text-decoration:underline}
.latest-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn-dl{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 24px;background:var(--strawberry-milk);color:#fff;
  border:var(--border-width) solid #c97a7a;border-radius:30px;
  font-weight:700;font-size:0.9rem;cursor:pointer;text-decoration:none;
  transition:all 0.3s var(--transition-bounce);
}
.btn-dl:hover{background:#fff;color:var(--strawberry-milk);transform:scale(1.05)}
.btn-tutorial{
  display:inline-flex;align-items:center;gap:6px;
  padding:10px 24px;background:#fffdfb;color:var(--text-primary);
  border:var(--border-width) solid var(--border-dark);border-radius:30px;
  font-weight:700;font-size:0.9rem;cursor:pointer;text-decoration:none;
  transition:all 0.3s var(--transition-bounce);
}
.btn-tutorial:hover{background:var(--mint-light);color:#3d6b4f;border-color:#8cc8a0;transform:scale(1.05)}

.search-section{margin-bottom:26px;position:relative;z-index:50}
.search-container{position:relative}
.search-input{
  width:100%;padding:14px 24px;font-size:0.95rem;
  border:var(--border-width) solid var(--border-dark);border-radius:50px;
  background:#fffdfb;color:var(--text-primary);outline:none;
  transition:all 0.3s;box-shadow:var(--shadow-soft);font-family:var(--font-body);
}
.search-input:focus{box-shadow:var(--shadow-deep);border-color:var(--strawberry-milk)}
.search-input::placeholder{color:var(--text-muted)}
.search-dropdown{
  position:absolute;top:calc(100% + 8px);left:8px;right:8px;
  background:#fffdfb;border:var(--border-width) solid var(--border-dark);
  border-radius:22px;box-shadow:var(--shadow-medium);z-index:200;
  max-height:280px;overflow-y:auto;opacity:0;visibility:hidden;
  transform:translateY(-8px);transition:all 0.25s;list-style:none;padding:6px 0;
}
.search-dropdown.active{opacity:1;visibility:visible;transform:translateY(0)}
.search-dropdown-item{
  padding:11px 20px;cursor:pointer;font-size:0.93rem;color:var(--text-primary);
  display:flex;align-items:center;gap:10px;transition:background 0.15s,color 0.15s;
}
.search-dropdown-item:hover{background:#fef0f0;color:#c97a7a}
.search-dropdown-item mark{background:#fef0f0;color:#c97a7a;font-weight:600;padding:0 2px;border-radius:3px}
.search-dropdown-empty{padding:18px 20px;text-align:center;color:var(--text-muted);font-size:0.88rem}
.search-item-type{font-size:0.7rem;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}
.search-item-type.launcher{background:#fef0f0;color:#c97a7a}
.search-item-type.game{background:#e8f5e8;color:#3d6b4f}

.history-section{margin-bottom:20px}
.history-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;gap:12px;
}
.history-title{
  font-size:1.25rem;font-weight:700;padding-left:14px;
  border-left:5px solid var(--strawberry-milk);white-space:nowrap;flex-shrink:0;
}
.history-title::after{
  content:'';position:relative;display:block;bottom:-4px;left:0;
  width:30px;height:3px;background:var(--mint-jelly);border-radius:2px;
}
.tab-group{
  display:inline-flex;border:var(--border-width) solid var(--border-dark);
  border-radius:30px;overflow:hidden;background:#fffdfb;flex-shrink:0;
}
.tab-btn{
  padding:9px 22px;border:none;border-radius:0;
  background:transparent;font-weight:600;font-size:0.85rem;
  color:var(--text-primary);cursor:pointer;transition:all 0.25s;

}
.tab-btn+.tab-btn{border-left:var(--border-width) solid var(--border-dark)}
.tab-btn.active{background:var(--strawberry-milk);color:#fff}

.version-list{display:flex;flex-direction:column;gap:14px;margin-bottom:30px}
.version-card{

.version-info{flex:1;min-width:0}
.version-name{font-weight:700;font-size:1.02rem;margin-bottom:4px}
.version-desc{

}
.version-desc.expanded{-webkit-line-clamp:unset;display:block}
.version-card-toggle{

}
.version-card-toggle:hover{color:#c97a7a;text-decoration:underline}
.version-meta{display:flex;gap:8px;flex-wrap:wrap}
.version-meta-tag{

  font-size:0.74rem;color:var(--text-secondary);font-weight:500;
}
.version-dl-btn{
  display:inline-flex;align-items:center;padding:9px 20px;
  background:var(--strawberry-milk);color:#fff;
  border:var(--border-width) solid #c97a7a;border-radius:30px;
  font-weight:700;font-size:0.85rem;cursor:pointer;text-decoration:none;
  transition:all 0.3s var(--transition-bounce);white-space:nowrap;flex-shrink:0;
}
.version-dl-btn:hover{background:#fff;color:var(--strawberry-milk);transform:scale(1.05)}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);font-size:0.92rem}

.pagination{
  display:flex;justify-content:center;align-items:center;gap:10px;
  margin:30px 0 40px;flex-wrap:nowrap;overflow:hidden;
}
.pagination-btn,.pagination-page{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:40px;height:40px;padding:0 12px;background:#fffdfb;
  border:var(--border-width) solid var(--border-dark);border-radius:30px;
  font-family:var(--font-body);font-size:0.9rem;font-weight:600;
  color:var(--text-primary);cursor:pointer;
  transition:all 0.3s var(--transition-bounce);box-shadow:var(--shadow-soft);user-select:none;
}
.pagination-btn:hover:not(:disabled),.pagination-page:hover:not(.active){
  background:var(--strawberry-light);color:#fff;border-color:#c97a7a;transform:scale(1.07);
}
.pagination-btn:disabled{opacity:0.3;cursor:not-allowed;pointer-events:none}
.pagination-page.active{
  background:var(--strawberry-milk);color:#fff;border-color:#c97a7a;
  box-shadow:0 2px 12px rgba(232,155,155,0.3);
}
.pagination-dots{color:var(--text-muted);font-weight:600;padding:0 4px;user-select:none}
.pagination-goto{display:inline-flex;align-items:center;gap:6px;margin-left:10px}

  box-shadow:var(--shadow-soft);transition:all 0.3s var(--transition-bounce);-moz-appearance:textfield;

.pagination-goto-input:focus{border-color:var(--strawberry-milk);box-shadow:var(--shadow-deep)}
.pagination-goto-btn{

.pagination-goto-mobile-trigger{display:none}

.toast{

.toast.show{transform:translateX(-50%) translateY(0)}

.goto-popup-overlay{

.goto-popup-title{font-size:0.95rem;font-weight:600;color:var(--text-primary)}
.goto-popup-row{display:flex;align-items:center;gap:10px}

.goto-popup-confirm:hover{background:#fff;color:var(--strawberry-milk);transform:scale(1.05)}

.footer{text-align:center;padding:30px 4px 20px;color:var(--text-muted);font-size:0.9rem}

@media(max-width:600px){

  .history-header{gap:10px}

  .version-card-inner{padding:14px 16px;flex-direction:column;align-items:flex-start;gap:10px}
  .version-dl-btn{align-self:flex-end}
  .pagination{gap:6px}
  .pagination-btn,.pagination-page{min-width:34px;height:34px;font-size:0.82rem;padding:0 8px}
  .pagination-dots{font-size:0.82rem;padding:0 2px}
  .pagination-goto-input,.pagination-goto-btn{display:none}
  .pagination-goto-mobile-trigger{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:34px;height:34px;padding:0 8px;background:#fffdfb;
    border:var(--border-width) solid var(--border-dark);border-radius:30px;
    font-size:0.82rem;font-weight:600;color:var(--text-primary);cursor:pointer;
    box-shadow:var(--shadow-soft);transition:all 0.3s var(--transition-bounce);user-select:none;
  }
  .pagination-goto-mobile-trigger:hover{background:var(--strawberry-light);color:#fff;border-color:#c97a7a}
  .pagination-goto{margin-left:6px}
}
@media(min-width:601px){
  .goto-popup-overlay{display:none!important}
}
</style>

var ITEMS_PER_PAGE=8;
var currentFilteredData=null;

var latestCard=document.getElementById('latestCard');
var versionList=document.getElementById('versionList');
var paginationEl=document.getElementById('pagination');
var searchInput=document.getElementById('searchInput');
var searchDropdown=document.getElementById('searchDropdown');
var searchContainer=document.getElementById('searchContainer');
var tabLauncher=document.getElementById('tabLauncher');
var tabGame=document.getElementById('tabGame');
var toastEl=document.getElementById('toast');
var toastTimer;

function showToast(msg){
  clearTimeout(toastTimer);
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2200);
}

function renderLatestCard(){
  var latest=launcherData.find(function(d){return d.isLatest});
  if(!latest){latestCard.style.display='none';return}
  latestCard.style.display='flex';
  var descId='latest-desc';
  var toggleId='latest-toggle';
  latestCard.innerHTML=
    '<img class="latest-icon" src="'+LAUNCHER_ICON+'" alt="启动器图标" onerror="this.style.display=\'none\'">'+
    '<div class="latest-info">'+
      '<div class="latest-label">最新版本 / 启动器</div>'+
      '<div class="latest-version">'+latest.version+'</div>'+
      '<div class="latest-meta">'+
        '<span class="meta-tag">'+latest.size+'</span>'+
        '<span class="meta-hint">* 需配合游戏本体一起使用</span>'+
      '</div>'+
      '<div class="latest-desc" id="'+descId+'">'+latest.description+'</div>'+
      '<span class="desc-toggle" id="'+toggleId+'" style="display:none;">展开</span>'+
      '<div class="latest-actions">'+
        '<a class="btn-dl" href="'+latest.downloadUrl+'" target="_blank" rel="noopener">下载启动器</a>'+
        '<a class="btn-tutorial" href="'+TUTORIAL_URL+'" target="_blank" rel="noopener">使用教程</a>'+
      '</div>'+
    '</div>';
  var descEl=document.getElementById(descId);
  var toggleEl=document.getElementById(toggleId);
  if(descEl&&toggleEl){
    setTimeout(function(){
      if(descEl.scrollHeight>descEl.clientHeight+2){
        toggleEl.style.display='inline-block';
      }
    },30);
    toggleEl.addEventListener('click',function(){
      var expanded=descEl.classList.toggle('expanded');
      toggleEl.textContent=expanded?'收起':'展开';
    });
  }
}

function getCurrentData(){
  var data=activeTab==='launcher'?launcherData:gameData;
  var query=searchInput.value.trim().toLowerCase();
  if(query){
    data=data.filter(function(item){
      return item.version.toLowerCase().indexOf(query)!==-1||item.description.toLowerCase().indexOf(query)!==-1;
    });
  }
  if(activeTab==='launcher'){
    data=data.filter(function(item){return !item.isLatest});
  }
  currentFilteredData=data;
  return data;
}

function renderVersionCards(pageData){
  versionList.innerHTML='';
  if(pageData.length===0){
    versionList.innerHTML='<div class="empty-state">没有找到匹配的版本</div>';
    return;
  }
  pageData.forEach(function(item,idx){
    var card=document.createElement('div');
    card.className='version-card';
    var descId='vdesc-'+activeTab+'-'+idx;
    var toggleId='vtoggle-'+activeTab+'-'+idx;
    card.innerHTML=
      '<div class="version-card-inner">'+
        '<div class="version-info">'+
          '<div class="version-name">'+item.version+'</div>'+
          '<div class="version-desc" id="'+descId+'">'+item.description+'</div>'+
          '<span class="version-card-toggle" id="'+toggleId+'" style="display:none;">展开</span>'+
          '<div class="version-meta">'+
            '<span class="version-meta-tag">'+item.size+'</span>'+
            '<span class="version-meta-tag">'+item.date+'</span>'+
          '</div>'+
        '</div>'+
        '<a class="version-dl-btn" href="'+item.downloadUrl+'" target="_blank" rel="noopener">下载</a>'+
      '</div>';
    versionList.appendChild(card);
    var descEl=document.getElementById(descId);
    var toggleEl=document.getElementById(toggleId);
    if(descEl&&toggleEl){
      (function(de,te){
        setTimeout(function(){
          if(de.scrollHeight>de.clientHeight+2){
            te.style.display='inline-block';
          }
        },30);
        te.addEventListener('click',function(){
          var expanded=de.classList.toggle('expanded');
          te.textContent=expanded?'收起':'展开';
        });
      })(descEl,toggleEl);
    }
  });
}

function renderPagination(totalItems,currentPageNum){
  paginationEl.innerHTML='';
  var totalPages=Math.ceil(totalItems/ITEMS_PER_PAGE);
  if(totalPages<=1) return;

  function createBtn(cls,content,disabled,handler){
    var btn=document.createElement('button');
    btn.className=cls;
    btn.innerHTML=content;
    btn.style.flexShrink='1';
    btn.style.minWidth='0';
    if(disabled) btn.disabled=true;
    if(handler) btn.addEventListener('click',handler);
    return btn;
  }

  function createPageBtn(num){
    return createBtn('pagination-page'+(num===currentPageNum?' active':''),num,false,function(){
      currentPage=num;
      renderCurrentPage();
      versionList.scrollIntoView({behavior:'smooth',block:'start'});
    });
  }

  function createDots(){
    var s=document.createElement('span');
    s.className='pagination-dots';
    s.textContent='...';
    s.style.flexShrink='1';
    s.style.minWidth='0';
    return s;
  }

  var items=[];
  items.push(createBtn('pagination-btn','&#8249;',currentPageNum<=1,function(){
    if(currentPage>1){currentPage--;renderCurrentPage();versionList.scrollIntoView({behavior:'smooth',block:'start'})}
  }));
  items.push(createPageBtn(1));
  if(totalPages<=4){
    for(var i=2;i<=totalPages;i++) items.push(createPageBtn(i));
  } else {
    if(currentPageNum<=4){
      for(var j=2;j<=4;j++) items.push(createPageBtn(j));
      items.push(createDots());
      items.push(createPageBtn(totalPages));
    } else {
      items.push(createDots());
      if(currentPageNum-1>1) items.push(createPageBtn(currentPageNum-1));
      items.push(createPageBtn(currentPageNum));
      if(currentPageNum+1<totalPages) items.push(createPageBtn(currentPageNum+1));
      items.push(createDots());
      items.push(createPageBtn(totalPages));
    }
  }
  items.push(createBtn('pagination-btn','&#8250;',currentPageNum>=totalPages,function(){
    if(currentPage<totalPages){currentPage++;renderCurrentPage();versionList.scrollIntoView({behavior:'smooth',block:'start'})}
  }));
  items.forEach(function(it){paginationEl.appendChild(it)});

  var gotoWrap=document.createElement('span');
  gotoWrap.className='pagination-goto';
  gotoWrap.style.flexShrink='0';
  gotoWrap.style.marginLeft='8px';

  var gotoInput=document.createElement('input');
  gotoInput.type='text';
  gotoInput.className='pagination-goto-input';
  gotoInput.placeholder='\\';
  gotoInput.maxLength=3;
  gotoInput.setAttribute('aria-label','输入页码');

  var gotoBtn=document.createElement('button');
  gotoBtn.className='pagination-goto-btn';
  gotoBtn.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" style="width:18px;height:18px"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
  gotoBtn.setAttribute('aria-label','跳转到指定页');

  var gotoMobile=document.createElement('button');
  gotoMobile.className='pagination-goto-mobile-trigger';
  gotoMobile.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="width:14px;height:14px"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';
  gotoMobile.setAttribute('aria-label','跳转页码');

  function doGoto(val){
    var num=parseInt(val,10);
    if(isNaN(num)||num<1||num>totalPages){showToast('页码范围：1 ~ '+totalPages);return}
    currentPage=num;
    renderCurrentPage();
    gotoInput.value='';
    versionList.scrollIntoView({behavior:'smooth',block:'start'});
  }

  gotoInput.addEventListener('input',function(){this.value=this.value.replace(/[^\d]/g,'').slice(0,3)});
  gotoInput.addEventListener('keydown',function(e){if(e.key==='Enter')doGoto(this.value)});
  gotoBtn.addEventListener('click',function(){doGoto(gotoInput.value)});
  gotoMobile.addEventListener('click',function(){openGotoPopup(totalPages)});

  gotoWrap.appendChild(gotoInput);
  gotoWrap.appendChild(gotoBtn);
  gotoWrap.appendChild(gotoMobile);
  paginationEl.appendChild(gotoWrap);
}

function openGotoPopup(totalPages){
  var existing=document.getElementById('gotoPopupOverlay');
  if(existing) existing.remove();
  var overlay=document.createElement('div');
  overlay.className='goto-popup-overlay active';
  overlay.id='gotoPopupOverlay';
  var popup=document.createElement('div');
  popup.className='goto-popup';
  var title=document.createElement('div');
  title.className='goto-popup-title';
  title.textContent='跳转到第几页？(共 '+totalPages+' 页)';
  var row=document.createElement('div');
  row.className='goto-popup-row';
  var input=document.createElement('input');
  input.type='text';
  input.className='goto-popup-input';
  input.placeholder='页码';
  input.maxLength=3;
  input.inputMode='numeric';
  input.addEventListener('input',function(){this.value=this.value.replace(/[^\d]/g,'').slice(0,3)});
  var confirmBtn=document.createElement('button');
  confirmBtn.className='goto-popup-confirm';
  confirmBtn.textContent='跳转';
  function doMobileGoto(){
    var num=parseInt(input.value,10);
    if(isNaN(num)||num<1||num>totalPages){showToast('页码范围：1 ~ '+totalPages);return}
    currentPage=num;
    renderCurrentPage();
    overlay.remove();
    setTimeout(function(){versionList.scrollIntoView({behavior:'smooth',block:'start'})},50);
  }
  input.addEventListener('keydown',function(e){if(e.key==='Enter')doMobileGoto()});
  confirmBtn.addEventListener('click',doMobileGoto);
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove()});
  row.appendChild(input);
  row.appendChild(confirmBtn);
  popup.appendChild(title);
  popup.appendChild(row);
  overlay.appendChild(popup);
  document.body.appendChild(overlay);
  setTimeout(function(){input.focus()},100);
}

function renderCurrentPage(){
  var data=getCurrentData();
  var start=(currentPage-1)*ITEMS_PER_PAGE;
  var end=start+ITEMS_PER_PAGE;
  renderVersionCards(data.slice(start,end));
  renderPagination(data.length,currentPage);
}

function switchTab(tab){
  activeTab=tab;
  currentPage=1;
  searchInput.value='';
  searchDropdown.classList.remove('active');
  tabLauncher.classList.toggle('active',tab==='launcher');
  tabGame.classList.toggle('active',tab==='game');
  renderCurrentPage();
}

tabLauncher.addEventListener('click',function(){switchTab('launcher')});
tabGame.addEventListener('click',function(){switchTab('game')});

function updateSearchDropdown(){
  var query=searchInput.value.trim();
  searchDropdown.innerHTML='';
  if(!query){searchDropdown.classList.remove('active');return}
  var lowerQuery=query.toLowerCase();
  var results=[];
  launcherData.forEach(function(item){
    if(item.version.toLowerCase().indexOf(lowerQuery)!==-1||item.description.toLowerCase().indexOf(lowerQuery)!==-1){
      results.push({item:item,type:'launcher',typeName:'启动器'});
    }
  });
  gameData.forEach(function(item){
    if(item.version.toLowerCase().indexOf(lowerQuery)!==-1||item.description.toLowerCase().indexOf(lowerQuery)!==-1){
      results.push({item:item,type:'game',typeName:'游戏本体'});
    }
  });
  if(results.length===0){
    searchDropdown.innerHTML='<li class="search-dropdown-empty">没有找到匹配的版本</li>';
  } else {
    var escapedQuery=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    var regex=new RegExp('('+escapedQuery+')','gi');
    results.slice(0,8).forEach(function(r){
      var li=document.createElement('li');
      li.className='search-dropdown-item';
      var highlighted=r.item.version.replace(regex,'<mark>$1</mark>');
      li.innerHTML='<span class="search-item-type '+r.type+'">'+r.typeName+'</span>'+'<span>'+highlighted+'</span>';
      li.addEventListener('click',function(){
        if(activeTab!==r.type){switchTab(r.type)}
        searchInput.value='';
        searchDropdown.classList.remove('active');
        var fullData=activeTab==='launcher'?launcherData.filter(function(d){return !d.isLatest}):gameData;
        var idx=-1;
        for(var i=0;i<fullData.length;i++){if(fullData[i].version===r.item.version){idx=i;break}}
        if(idx!==-1){
          var targetPage=Math.floor(idx/ITEMS_PER_PAGE)+1;
          currentPage=targetPage;
          renderCurrentPage();
          setTimeout(function(){
            var cards=versionList.querySelectorAll('.version-card');
            var cardIdx=idx%ITEMS_PER_PAGE;
            if(cards[cardIdx]){
              cards[cardIdx].style.boxShadow='0 0 0 3px var(--strawberry-milk), var(--shadow-deep)';
              cards[cardIdx].scrollIntoView({behavior:'smooth',block:'center'});
              setTimeout(function(){cards[cardIdx].style.boxShadow=''},2000);
            }
          },100);
        }
      });
      searchDropdown.appendChild(li);
    });
  }
  searchDropdown.classList.add('active');
}

searchInput.addEventListener('input',function(){
  currentPage=1;
  renderCurrentPage();
  updateSearchDropdown();
});
searchInput.addEventListener('focus',function(){
  if(searchInput.value.trim().length>=1) updateSearchDropdown();
});
searchInput.addEventListener('keydown',function(e){
  if(e.key==='Escape'){searchDropdown.classList.remove('active');searchInput.blur()}
  if(e.key==='Enter'){searchDropdown.classList.remove('active')}
});
document.addEventListener('click',function(e){
  if(!searchContainer.contains(e.target)) searchDropdown.classList.remove('active');
});

renderLatestCard();
renderCurrentPage();
})();
</script>
</body>
</html>
