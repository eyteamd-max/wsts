var activeTab='launcher';
var currentPage=1;
var ITEMS_PER_PAGE=8;
var currentFilteredData=null;

var latestCard=document.getElementById('latestCard');
var versionList=document.getElementById('versionList');
var paginationEl=document.getElementById('pagination');
var searchInput=document.getElementById('searchInput');
var searchDropdown=document.getElementById('searchDropdown');
var searchContainer=document.getElementById('searchContainer');
var tabLauncher=document.getElementById('tabLauncher');
var tabGame=document.getElementById('tabGame');
var toastEl=document.getElementById('toast');
var toastTimer;

function showToast(msg){clearTimeout(toastTimer);toastEl.textContent=msg;toastEl.classList.add('show');toastTimer=setTimeout(function(){toastEl.classList.remove('show')},2200)}

/* 溢出检测：字符数兜底 + 双帧rAF精确检测 */
function checkOverflow(textEl,toggleEl){
  if(textEl.textContent.length>20){
    toggleEl.style.display='inline';
    return;
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    if(textEl.scrollWidth>textEl.clientWidth+2) toggleEl.style.display='inline';
  })});
}

function renderLatestCard(){
  var latest=launcherData.find(function(d){return d.isLatest});
  if(!latest){latestCard.style.display='none';return}
  latestCard.style.display='flex';
  latestCard.innerHTML=
    '<img class="latest-icon" src="'+LAUNCHER_ICON+'" alt="启动器图标" onerror="this.style.display=\'none\'">'+
    '<div class="latest-info">'+
      '<div class="latest-version">'+latest.version+' <span class="latest-suffix">/ 最新版本 / 启动器 / '+latest.size+'</span></div>'+
      '<div class="latest-hint">* 这只是启动器 需配合游戏本体一起使用</div>'+
      '<div class="desc-wrap">'+
        '<span class="desc-text" id="latest-desc">'+latest.description+'</span>'+
        '<span class="desc-toggle" id="latest-toggle" style="display:none;">展开</span>'+
      '</div>'+
      '<div class="latest-actions">'+
        '<a class="btn-dl" href="'+latest.downloadUrl+'" target="_blank" rel="noopener">下载启动器</a>'+
        '<a class="btn-tutorial" href="'+TUTORIAL_URL+'" target="_blank" rel="noopener">使用教程</a>'+
      '</div>'+
    '</div>';
  var de=document.getElementById('latest-desc'),te=document.getElementById('latest-toggle');
  if(de&&te){checkOverflow(de,te);te.addEventListener('click',function(){var ex=de.classList.toggle('expanded');te.textContent=ex?'收起':'展开'})}
}

function getCurrentData(){
  var data=activeTab==='launcher'?launcherData:gameData;
  var query=searchInput.value.trim().toLowerCase();
  if(query){data=data.filter(function(item){return item.version.toLowerCase().indexOf(query)!==-1||item.description.toLowerCase().indexOf(query)!==-1})}
  currentFilteredData=data;return data;
}

function renderVersionCards(pageData){
  versionList.innerHTML='';
  if(pageData.length===0){versionList.innerHTML='<div class="empty-state">没有找到匹配的版本</div>';return}
  pageData.forEach(function(item,idx){
    var card=document.createElement('div');card.className='version-card';
    var did='vd-'+activeTab+'-'+idx,tid='vt-'+activeTab+'-'+idx;
    card.innerHTML=
      '<div class="version-card-inner">'+
        '<div class="version-info">'+
          '<div class="version-name">'+item.version+'</div>'+
          '<div class="vdesc-wrap">'+
            '<span class="vdesc-text" id="'+did+'">'+item.description+'</span>'+
            '<span class="vdesc-toggle" id="'+tid+'" style="display:none;">展开</span>'+
          '</div>'+
          '<div class="version-meta">'+
            '<span class="version-meta-tag">'+item.size+'</span>'+
            '<span class="version-meta-tag">'+item.date+'</span>'+
          '</div>'+
        '</div>'+
        '<a class="version-dl-btn" href="'+item.downloadUrl+'" target="_blank" rel="noopener">下载</a>'+
      '</div>';
    versionList.appendChild(card);
    var de=document.getElementById(did),te=document.getElementById(tid);
    if(de&&te){(function(d,t){checkOverflow(d,t);t.addEventListener('click',function(){var ex=d.classList.toggle('expanded');t.textContent=ex?'收起':'展开'})})(de,te)}
  });
}

function renderPagination(totalItems,currentPageNum){
  paginationEl.innerHTML='';var totalPages=Math.ceil(totalItems/ITEMS_PER_PAGE);if(totalPages<=1)return;
  function createBtn(cls,content,disabled,handler){var btn=document.createElement('button');btn.className=cls;btn.innerHTML=content;btn.style.flexShrink='1';btn.style.minWidth='0';if(disabled)btn.disabled=true;if(handler)btn.addEventListener('click',handler);return btn}
  function createPageBtn(num){return createBtn('pagination-page'+(num===currentPageNum?' active':''),num,false,function(){currentPage=num;renderCurrentPage();versionList.scrollIntoView({behavior:'smooth',block:'start'})})}
  function createDots(){var s=document.createElement('span');s.className='pagination-dots';s.textContent='...';s.style.flexShrink='1';s.style.minWidth='0';return s}
  var items=[];
  items.push(createBtn('pagination-btn','&#8249;',currentPageNum<=1,function(){if(currentPage>1){currentPage--;renderCurrentPage();versionList.scrollIntoView({behavior:'smooth',block:'start'})}}));
  items.push(createPageBtn(1));
  if(totalPages<=4){for(var i=2;i<=totalPages;i++)items.push(createPageBtn(i))}
  else{if(currentPageNum<=4){for(var j=2;j<=4;j++)items.push(createPageBtn(j));items.push(createDots());items.push(createPageBtn(totalPages))}else{items.push(createDots());if(currentPageNum-1>1)items.push(createPageBtn(currentPageNum-1));items.push(createPageBtn(currentPageNum));if(currentPageNum+1<totalPages)items.push(createPageBtn(currentPageNum+1));items.push(createDots());items.push(createPageBtn(totalPages))}}
  items.push(createBtn('pagination-btn','&#8250;',currentPageNum>=totalPages,function(){if(currentPage<totalPages){currentPage++;renderCurrentPage();versionList.scrollIntoView({behavior:'smooth',block:'start'})}}));
  items.forEach(function(it){paginationEl.appendChild(it)});
  var gw=document.createElement('span');gw.className='pagination-goto';gw.style.flexShrink='0';gw.style.marginLeft='8px';
  var gi=document.createElement('input');gi.type='text';gi.className='pagination-goto-input';gi.placeholder='\\';gi.maxLength=3;gi.setAttribute('aria-label','输入页码');
  var gb=document.createElement('button');gb.className='pagination-goto-btn';gb.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" style="width:18px;height:18px"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';gb.setAttribute('aria-label','跳转到指定页');
  var gm=document.createElement('button');gm.className='pagination-goto-mobile-trigger';gm.innerHTML='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="width:14px;height:14px"><circle cx="8.5" cy="8.5" r="5.5"/><line x1="12.5" y1="12.5" x2="17.5" y2="17.5"/></svg>';gm.setAttribute('aria-label','跳转页码');
  function doGoto(v){var n=parseInt(v,10);if(isNaN(n)||n<1||n>totalPages){showToast('页码范围：1 ~ '+totalPages);return}currentPage=n;renderCurrentPage();gi.value='';versionList.scrollIntoView({behavior:'smooth',block:'start'})}
  gi.addEventListener('input',function(){this.value=this.value.replace(/[^\d]/g,'').slice(0,3)});
  gi.addEventListener('keydown',function(e){if(e.key==='Enter')doGoto(this.value)});
  gb.addEventListener('click',function(){doGoto(gi.value)});
  gm.addEventListener('click',function(){openGotoPopup(totalPages)});
  gw.appendChild(gi);gw.appendChild(gb);gw.appendChild(gm);paginationEl.appendChild(gw);
}

function openGotoPopup(totalPages){
  var ex=document.getElementById('gotoPopupOverlay');if(ex)ex.remove();
  var ol=document.createElement('div');ol.className='goto-popup-overlay active';ol.id='gotoPopupOverlay';
  var pp=document.createElement('div');pp.className='goto-popup';
  var tt=document.createElement('div');tt.className='goto-popup-title';tt.textContent='跳转到第几页？(共 '+totalPages+' 页)';
  var rw=document.createElement('div');rw.className='goto-popup-row';
  var ip=document.createElement('input');ip.type='text';ip.className='goto-popup-input';ip.placeholder='页码';ip.maxLength=3;ip.inputMode='numeric';ip.addEventListener('input',function(){this.value=this.value.replace(/[^\d]/g,'').slice(0,3)});
  var cb=document.createElement('button');cb.className='goto-popup-confirm';cb.textContent='跳转';
  function doG(){var n=parseInt(ip.value,10);if(isNaN(n)||n<1||n>totalPages){showToast('页码范围：1 ~ '+totalPages);return}currentPage=n;renderCurrentPage();ol.remove();setTimeout(function(){versionList.scrollIntoView({behavior:'smooth',block:'start'})},50)}
  ip.addEventListener('keydown',function(e){if(e.key==='Enter')doG()});cb.addEventListener('click',doG);ol.addEventListener('click',function(e){if(e.target===ol)ol.remove()});
  rw.appendChild(ip);rw.appendChild(cb);pp.appendChild(tt);pp.appendChild(rw);ol.appendChild(pp);document.body.appendChild(ol);setTimeout(function(){ip.focus()},100);
}

function renderCurrentPage(){var data=getCurrentData();var start=(currentPage-1)*ITEMS_PER_PAGE;renderVersionCards(data.slice(start,start+ITEMS_PER_PAGE));renderPagination(data.length,currentPage)}

function switchTab(tab){activeTab=tab;currentPage=1;searchInput.value='';searchDropdown.classList.remove('active');tabLauncher.classList.toggle('active',tab==='launcher');tabGame.classList.toggle('active',tab==='game');renderCurrentPage()}

tabLauncher.addEventListener('click',function(){switchTab('launcher')});
tabGame.addEventListener('click',function(){switchTab('game')});

function updateSearchDropdown(){
  var query=searchInput.value.trim();searchDropdown.innerHTML='';if(!query){searchDropdown.classList.remove('active');return}
  var lq=query.toLowerCase(),results=[];
  launcherData.forEach(function(item){if(item.version.toLowerCase().indexOf(lq)!==-1||item.description.toLowerCase().indexOf(lq)!==-1)results.push({item:item,type:'launcher',typeName:'启动器'})});
  gameData.forEach(function(item){if(item.version.toLowerCase().indexOf(lq)!==-1||item.description.toLowerCase().indexOf(lq)!==-1)results.push({item:item,type:'game',typeName:'游戏本体'})});
  if(results.length===0){searchDropdown.innerHTML='<li class="search-dropdown-empty">没有找到匹配的版本</li>'}
  else{var eq=query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),rx=new RegExp('('+eq+')','gi');results.slice(0,8).forEach(function(r){var li=document.createElement('li');li.className='search-dropdown-item';li.innerHTML='<span class="search-item-type '+r.type+'">'+r.typeName+'</span><span>'+r.item.version.replace(rx,'<mark>$1</mark>')+'</span>';li.addEventListener('click',function(){if(activeTab!==r.type)switchTab(r.type);searchInput.value='';searchDropdown.classList.remove('active');var fd=activeTab==='launcher'?launcherData:gameData;var idx=-1;for(var i=0;i<fd.length;i++){if(fd[i].version===r.item.version){idx=i;break}}if(idx!==-1){currentPage=Math.floor(idx/ITEMS_PER_PAGE)+1;renderCurrentPage();setTimeout(function(){var cards=versionList.querySelectorAll('.version-card');var ci=idx%ITEMS_PER_PAGE;if(cards[ci]){cards[ci].style.boxShadow='0 0 0 3px var(--strawberry-milk), var(--shadow-deep)';cards[ci].scrollIntoView({behavior:'smooth',block:'center'});setTimeout(function(){cards[ci].style.boxShadow=''},2000)}},100)}});searchDropdown.appendChild(li)})}
  searchDropdown.classList.add('active');
}

searchInput.addEventListener('input',function(){currentPage=1;renderCurrentPage();updateSearchDropdown()});
searchInput.addEventListener('focus',function(){if(searchInput.value.trim().length>=1)updateSearchDropdown()});
searchInput.addEventListener('keydown',function(e){if(e.key==='Escape'){searchDropdown.classList.remove('active');searchInput.blur()}if(e.key==='Enter')searchDropdown.classList.remove('active')});
document.addEventListener('click',function(e){if(!searchContainer.contains(e.target))searchDropdown.classList.remove('active')});

renderLatestCard();renderCurrentPage();
})();
</script>
</body>
</html>
