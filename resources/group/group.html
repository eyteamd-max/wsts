
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入玩家群，一起交流 MOD 与疑问解答</title>
    <meta name="referrer" content="no-referrer">
    <style>
        :root {
            --bg: #faf8f5;
            --card-bg: #fffefb;
            --text: #3b3733;
            --text-secondary: #6b645b;
            --text-muted: #9e958a;
            --border: #e2dbd0;
            --border-light: #ede6db;
            --accent: #d4846a;
            --accent-hover: #c0735a;
            --accent-bg: #fdf3ee;
            --shadow-sm: 0 1px 3px rgba(60, 50, 40, 0.06);
            --shadow-md: 0 4px 16px rgba(60, 50, 40, 0.09);
            --shadow-lg: 0 8px 28px rgba(60, 50, 40, 0.13);
            --radius: 18px;
            --radius-sm: 12px;
            --font-stack: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 15%, rgba(212, 132, 106, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, rgba(160, 140, 120, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 32px 16px 56px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 640px;
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8e8578;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.5;
            display: inline-block;
            position: relative;
        }

        .subtitle::before,
        .subtitle::after {
            content: '·';
            display: inline-block;
            margin: 0 6px;
            color: #d0c4b5;
            font-weight: 400;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        .group-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
            align-items: center;
        }

        .group-card {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 22px 22px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-sm);
            transition: box-shadow var(--transition), transform var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            position: relative;
        }

        .group-card:hover {
            box-shadow: var(--shadow-md);
            border-color: #d5cdc0;
            transform: translateY(-2px);
        }

        .group-card--active:hover {
            box-shadow: var(--shadow-lg);
            border-color: #dcc0b2;
        }

        .group-card--inactive {
            background: #fafaf7;
            border-color: var(--border-light);
            box-shadow: none;
            opacity: 0.72;
        }

        .group-card--inactive:hover {
            box-shadow: var(--shadow-sm);
            border-color: var(--border-light);
            transform: none;
            opacity: 0.8;
        }

        .avatar-wrap {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border);
            background: #f3f0ea;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .group-card--active .avatar-wrap {
            border-color: #e0cfc2;
            box-shadow: 0 0 0 3px rgba(212, 132, 106, 0.08);
        }

        .group-card--inactive .avatar-wrap {
            border-color: #e8e4db;
            background: #f5f3ee;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-fallback {
            font-size: 1.8rem;
            line-height: 1;
            color: #c5bdb0;
            user-select: none;
        }

        .group-card--inactive .avatar-fallback {
            color: #d5d0c6;
        }

        .group-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .group-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .group-name {
            font-weight: 650;
            font-size: 0.95rem;
            color: var(--text);
            line-height: 1.35;
            letter-spacing: 0.015em;
        }

        .group-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            line-height: 1.6;
            white-space: nowrap;
            user-select: none;
            flex-shrink: 0;
        }

        .group-card--active .group-badge {
            background: #fef2ed;
            color: #c06a4e;
            border: 1px solid #f3d3c6;
        }

        .group-card--inactive .group-badge {
            background: #f3f1ed;
            color: #a09888;
            border: 1px solid #e4dfd5;
        }

        .group-number-row {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        .group-number-row .label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .group-number-row .number {
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'Menlo', 'PingFang SC', monospace;
        }

        .group-card--inactive .group-number-row .number {
            color: var(--text-muted);
            font-weight: 500;
        }

        .action-area {
            flex-shrink: 0;
            margin-left: auto;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all var(--transition);
            letter-spacing: 0.02em;
            font-family: var(--font-stack);
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            outline: none;
            box-shadow: 0 2px 8px rgba(212, 132, 106, 0.22);
        }

        .copy-btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 14px rgba(212, 132, 106, 0.3);
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(212, 132, 106, 0.2);
            transition: 0.1s;
        }

        .status-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 9px 16px;
            background: #f3f1ec;
            color: #a09888;
            border: 1px solid #e6e1d7;
            border-radius: 22px;
            font-weight: 500;
            font-size: 0.82rem;
            letter-spacing: 0.02em;
            white-space: nowrap;
            user-select: none;
            cursor: default;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c5bcaa;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #fffefb;
            border: 1.5px solid #d5cdc0;
            border-radius: 24px;
            padding: 10px 22px;
            font-weight: 550;
            font-size: 0.88rem;
            color: var(--text);
            box-shadow: var(--shadow-lg);
            transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
            z-index: 200;
            white-space: nowrap;
            letter-spacing: 0.02em;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .back-link-wrap {
            margin-top: 36px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 18px;
            background: transparent;
            border: 1.5px solid transparent;
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.88rem;
            transition: all var(--transition);
            letter-spacing: 0.02em;
        }

        .back-link:hover {
            background: #fffefb;
            border-color: #e2dbd0;
            color: var(--text);
            box-shadow: var(--shadow-sm);
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 10px 44px;
            }

            .subtitle {
                font-size: 0.85rem;
            }
            .subtitle::before,
            .subtitle::after {
                margin: 0 4px;
                font-size: 0.8rem;
            }

            .header {
                margin-bottom: 24px;
            }

            .group-card {
                flex-wrap: wrap;
                padding: 20px 16px 18px;
                gap: 12px;
                border-radius: var(--radius-sm);
            }

            .avatar-wrap {
                width: 50px;
                height: 50px;
            }
            .avatar-fallback {
                font-size: 1.5rem;
            }

            .group-info {
                flex: 1 1 auto;
                min-width: 140px;
            }
            .group-name {
                font-size: 0.9rem;
            }
            .group-badge {
                font-size: 0.68rem;
                padding: 1px 8px;
            }
            .group-number-row {
                font-size: 0.82rem;
            }

            .action-area {
                margin-left: 0;
                width: 100%;
                display: flex;
                justify-content: flex-end;
            }

            .copy-btn,
            .status-tag {
                padding: 8px 16px;
                font-size: 0.8rem;
                border-radius: 20px;
            }

            .back-link {
                font-size: 0.82rem;
                padding: 7px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <p class="subtitle">加入玩家群，一起交流 MOD 与疑问解答</p>
        </div>

        <div class="group-list" id="groupList"></div>

        <div class="back-link-wrap">
            <a href="../index.html" class="back-link">← 返回 MOD 站首页</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        (function() {
            const groups = [
                {
                    name: '杀戮尖塔2 移植版交流群',
                    badge: '一群',
                    number: '1101853266',
                    avatar: 'https://p.qlogo.cn/gh/1101853266/1101853266/0',
                    active: true
                },
                {
                    name: '二群',
                    badge: '二群',
                    number: null,
                    avatar: '',
                    active: false
                }
            ];

            const groupList = document.getElementById('groupList');
            const toast = document.getElementById('toast');

            function renderGroups() {
                groupList.innerHTML = '';
                groups.forEach((group) => {
                    const card = document.createElement('div');
                    card.className = 'group-card';
                    if (group.active) {
                        card.classList.add('group-card--active');
                    } else {
                        card.classList.add('group-card--inactive');
                    }

                    const avatarWrap = document.createElement('div');
                    avatarWrap.className = 'avatar-wrap';

                    if (group.avatar && group.active) {
                        const img = document.createElement('img');
                        img.className = 'avatar-img';
                        img.src = group.avatar;
                        img.alt = group.name;
                        img.loading = 'lazy';
                        img.addEventListener('error', () => {
                            avatarWrap.innerHTML = '<span class="avatar-fallback">🐱</span>';
                        });
                        avatarWrap.appendChild(img);
                    } else if (group.active) {
                        avatarWrap.innerHTML = '<span class="avatar-fallback">🐱</span>';
                    } else {
                        avatarWrap.innerHTML = '<span class="avatar-fallback">🌱</span>';
                    }

                    const info = document.createElement('div');
                    info.className = 'group-info';

                    const nameRow = document.createElement('div');
                    nameRow.className = 'group-name-row';

                    const nameEl = document.createElement('span');
                    nameEl.className = 'group-name';
                    nameEl.textContent = group.name;

                    const badgeEl = document.createElement('span');
                    badgeEl.className = 'group-badge';
                    badgeEl.textContent = group.badge;

                    nameRow.appendChild(nameEl);
                    nameRow.appendChild(badgeEl);

                    const numberRow = document.createElement('div');
                    numberRow.className = 'group-number-row';

                    const label = document.createElement('span');
                    label.className = 'label';
                    label.textContent = '群号：';

                    const numberVal = document.createElement('span');
                    numberVal.className = 'number';
                    numberVal.textContent = group.number || '暂无';

                    numberRow.appendChild(label);
                    numberRow.appendChild(numberVal);

                    info.appendChild(nameRow);
                    info.appendChild(numberRow);

                    const actionArea = document.createElement('div');
                    actionArea.className = 'action-area';

                    if (group.active && group.number) {
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = '复制群号';
                        copyBtn.setAttribute('data-number', group.number);
                        copyBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const num = copyBtn.getAttribute('data-number');
                            copyToClipboard(num);
                        });
                        actionArea.appendChild(copyBtn);
                    } else {
                        const statusTag = document.createElement('span');
                        statusTag.className = 'status-tag';
                        statusTag.innerHTML = '<span class="status-dot"></span>暂未开放';
                        actionArea.appendChild(statusTag);
                    }

                    card.appendChild(avatarWrap);
                    card.appendChild(info);
                    card.appendChild(actionArea);
                    groupList.appendChild(card);
                });
            }

            function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast('群号已复制，快去粘贴加群吧！');
                    }).catch(() => {
                        fallbackCopy(text);
                    });
                } else {
                    fallbackCopy(text);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                textarea.style.pointerEvents = 'none';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast('群号已复制，快去粘贴加群吧！');
                } catch (err) {
                    showToast('⚠️ 复制失败，请手动复制群号');
                }
                document.body.removeChild(textarea);
            }

            let toastTimer;
            function showToast(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            renderGroups();
        })();
    </script>
</body>
</html>
